name: Publish images

# 合并到 main 后在 GitHub 云端构建共用主机部署用的镜像（infra/shared），推送到 GHCR。
# 服务器自己拉取，不再从本机上传（本机上行带宽窄）。用法见 infra/shared/README.md “后续更新”。
on:
  push:
    # 临时：首次验证时允许从部署分支构建，合并前删掉 chore/shared-host-deploy 这一项。
    branches: [main, chore/shared-host-deploy]
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/Dockerfile"
      - "infra/shared/Caddyfile"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".dockerignore"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    name: build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Image names and tag
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "server=ghcr.io/${owner}/proofgym-server" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/proofgym-web" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.server }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.server }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build and push web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          target: web-shared
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.web }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.web }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Summary
        run: |
          {
            echo "### 已发布镜像"
            echo
            echo "- \`${{ steps.meta.outputs.server }}:${{ steps.meta.outputs.tag }}\`"
            echo "- \`${{ steps.meta.outputs.web }}:${{ steps.meta.outputs.tag }}\`"
            echo
            echo "服务器上：\`TAG=${{ steps.meta.outputs.tag }}\`，拉取与启动命令见 infra/shared/README.md “后续更新”。"
          } >> "$GITHUB_STEP_SUMMARY"
