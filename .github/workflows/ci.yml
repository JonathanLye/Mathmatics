name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限：默认不给 token 任何权限；每个 job 自己声明
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: 证明陪练场_产品设计工作区/10-开发文档/contracts
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 证明陪练场_产品设计工作区/10-开发文档/contracts/package-lock.json
      - name: Install
        run: npm ci
      - name: Contract gate
        run: npm run check

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Docs structure
        run: node tools/check-docs.mjs

  workspace:
    name: workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup pnpm and Node
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Contracts copy in sync
        run: node tools/sync-contracts.mjs --check
      - name: Contract types in sync
        run: pnpm gen:types --check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Smoke
        run: pnpm build

  # PGlite 覆盖不到 node-postgres 驱动路径与真实 advisory 锁；这个 job 只做迁移/种子冒烟，不进 ci-gate。
  postgres:
    name: postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: proof_gym
          POSTGRES_USER: proof_gym
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proof_gym -d proof_gym"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://proof_gym:postgres@127.0.0.1:5432/proof_gym
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup pnpm and Node
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Migrate twice on real PostgreSQL
        run: pnpm db:migrate && pnpm db:migrate
      - name: Seed
        run: pnpm db:seed
      - name: Assert version table and schema
        working-directory: apps/server
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          const versions = await client.query('select version, sha256 from public.schema_migrations order by version');
          if (!versions.rows.some((row) => row.version === '0000_init')) throw new Error('缺少基线 0000_init');
          for (const row of versions.rows) {
            if (row.version !== '0000_init' && !/^[0-9a-f]{64}$/.test(row.sha256 ?? '')) {
              throw new Error(`迁移缺少 sha256：${row.version}`);
            }
          }
          const tables = await client.query("select to_regclass('app.users') as users, to_regclass('app.attempts') as attempts");
          if (!tables.rows[0].users || !tables.rows[0].attempts) throw new Error('schema.sql 未生效');
          await client.end();
          NODE
      # #74 / 复审报告 P1-4：同一套代码在真实 PostgreSQL 上验证「两批事件反向引用同一批作答」不死锁、
      # seq 不重不漏。DATABASE_URL 已由 job env 提供；本地无 DATABASE_URL 时该测试退化为 PGlite 逻辑校验。
      - name: Concurrency test on real PostgreSQL
        working-directory: apps/server
        run: npx vitest run test/postgres-concurrency.test.ts

  # 学生端 e2e（可选，**不进 ci-gate**）：真实浏览器跑 3 档布局截图（浅色 + 深色）+ mock 状态 DOM 断言。
  # 用 continue-on-error：e2e 失败只给信号、不拖挂必过门禁；稳定后再考虑并入 ci-gate。
  # PR #87 审计：此前 e2e 只认 Windows 本机浏览器、且不进 CI，Linux 上直接 exit=2。
  student-e2e:
    name: student-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup pnpm and Node
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build student H5 (mock build for state screenshots)
        run: pnpm --filter @proof-gym/student build:mock
      - name: Install Chromium (match playwright-core)
        working-directory: apps/student
        run: npx --yes playwright@$(node -p "require('playwright-core/package.json').version") install --with-deps chromium
      - name: Locate Chromium
        run: |
          CHROME_BIN=$(find "$HOME/.cache/ms-playwright" -type f -name chrome | head -n 1)
          if [ -z "$CHROME_BIN" ]; then echo 'chromium binary not found'; exit 1; fi
          echo "PG_CHROMIUM=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Screens + mock 状态断言（390/768/1280，浅色）
        run: pnpm --filter @proof-gym/student run e2e:screens
      - name: Screens + mock 状态断言（390/768/1280，深色）
        # #155 的深色 33/33 此前只在本地；CI 也要跑，避免「CI 绿」不覆盖深色（--dark → .artifacts/screens-dark）
        run: pnpm --filter @proof-gym/student run e2e:screens:dark
      - name: Flows（本分支有脚本才跑；#88/#89 等后续 PR 接入）
        run: |
          node -e "const s=require('./apps/student/package.json').scripts||{};process.stdout.write(Object.keys(s).filter(k=>k.startsWith('e2e:flows')).join(' '))" > /tmp/e2e-flows.txt
          if [ -s /tmp/e2e-flows.txt ]; then
            for script in $(cat /tmp/e2e-flows.txt); do pnpm --filter @proof-gym/student run "$script"; done
          else
            echo "本分支没有 e2e:flows 脚本，跳过"
          fi

  # 唯一 required status check：子 job 跳过也算过，真实失败才红。
  ci-gate:
    name: ci-gate
    if: always()
    needs: [contracts, docs, workspace]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check required jobs
        env:
          CONTRACTS: ${{ needs.contracts.result }}
          DOCS: ${{ needs.docs.result }}
          WORKSPACE: ${{ needs.workspace.result }}
        run: |
          echo "contracts=$CONTRACTS docs=$DOCS workspace=$WORKSPACE"
          if [ "$CONTRACTS" = "failure" ] || [ "$CONTRACTS" = "cancelled" ] || [ "$DOCS" = "failure" ] || [ "$DOCS" = "cancelled" ] || [ "$WORKSPACE" = "failure" ] || [ "$WORKSPACE" = "cancelled" ]; then
            echo "::error::One or more required jobs failed or were cancelled"
            exit 1
          fi
          echo "CI gate passed."
