name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限：默认不给 token 任何权限；每个 job 自己声明
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: 证明陪练场_产品设计工作区/10-开发文档/contracts
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 证明陪练场_产品设计工作区/10-开发文档/contracts/package-lock.json
      - name: Install
        run: npm ci
      - name: Contract gate
        run: npm run check

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Docs structure
        run: node tools/check-docs.mjs

  # 唯一 required status check：子 job 跳过也算过，真实失败才红。
  ci-gate:
    name: ci-gate
    if: always()
    needs: [contracts, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check required jobs
        env:
          CONTRACTS: ${{ needs.contracts.result }}
          DOCS: ${{ needs.docs.result }}
        run: |
          echo "contracts=$CONTRACTS docs=$DOCS"
          if [ "$CONTRACTS" = "failure" ] || [ "$CONTRACTS" = "cancelled" ] || [ "$DOCS" = "failure" ] || [ "$DOCS" = "cancelled" ]; then
            echo "::error::One or more required jobs failed or were cancelled"
            exit 1
          fi
          echo "CI gate passed."
