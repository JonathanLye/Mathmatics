# 模型注册表（09 §2）。地址与密钥只从环境变量读取：字段里的 "${VAR}" 在加载时展开。
# 某个 provider 引用的变量为空 → 它未配置：调用被跳过（skipped），/health 的 deps 显示 degraded；不阻止启动。
providers:
  typesafe:
    baseUrl: "${JEV_BASE_URL}"
    apiKey: "${JEV_API_KEY}"
    region: overseas
    timeoutMs: 1500
  deepseek:
    baseUrl: "https://api.deepseek.com"
    apiKey: "${DEEPSEEK_API_KEY}"
    region: cn
    timeoutMs: 8000
  dashscope:
    baseUrl: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    apiKey: "${DASHSCOPE_API_KEY}"
    region: cn
    timeoutMs: 6000
  simpletex:
    baseUrl: "https://server.simpletex.cn"
    appId: "${SIMPLETEX_APP_ID}"
    appSecret: "${SIMPLETEX_APP_SECRET}"
    region: cn
    timeoutMs: 5000
models:
  decide:
    provider: typesafe
    model: jev-1.13
  # 求助回答与语义判定（U15）。默认都指向通义千问；配好 DEEPSEEK_API_KEY 后，把 provider 改成 deepseek 或设 MODEL_FAST 即可切换。
  # 单价为估算（元 / 百万 token），只用于 app.model_calls.cost_cny 与每日预算。
  fast:
    provider: dashscope
    model: qwen3.8-flash
    thinking: false
    inputCnyPerM: 0.3
    outputCnyPerM: 3
  strong:
    provider: dashscope
    model: qwen3.8-flash
    thinking: false
    inputCnyPerM: 0.3
    outputCnyPerM: 3
  # 闸门第三层的独立复核（看得到未透露的步骤，和生成不是同一次调用）。
  review:
    provider: dashscope
    model: qwen3.8-flash
    thinking: false
    inputCnyPerM: 0.3
    outputCnyPerM: 3
  deepseek_fast:
    provider: deepseek
    model: deepseek-flash
    thinking: false
    inputCnyPerM: 2
    outputCnyPerM: 8
  cross:
    provider: dashscope
    model: qwen3.8-flash
  ocr_line:
    provider: simpletex
    endpoint: /api/latex_ocr_turbo
  ocr_line_std:
    provider: simpletex
    endpoint: /api/latex_ocr
  ocr_page:
    provider: simpletex
    endpoint: /api/simpletex_ocr
flags:
  jev.shadowOnly: true
  lessonGenerated: false
  ocr.primary: simpletex
  ocr.cross: true
  photo.enabled: true
  # 求助回答：关（默认）→ 模板；help.llm.shadow → 模板先返回、模型在后台只记录；help.llm → 模型回答生效（过三重闸门）。
  # 评测达标后由部署环境变量打开：FLAG_HELP_LLM=true / FLAG_HELP_LLM_SHADOW=true / FLAG_LLM_FALLBACKCLASSIFY=true。
  help.llm: false
  help.llm.shadow: false
  llm.fallbackClassify: false
