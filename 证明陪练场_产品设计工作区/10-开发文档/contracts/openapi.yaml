      properties:
        id: { type: string }
        group: { type: string, enum: [definition, basis, scaling, hinted, selfcheck, other] }
        problemTitle: { type: string }
        chapter: { type: string }
        attemptId: { type: string, format: uuid, description: '重做时调用 POST /student/attempts/{attemptId}/redo' }
        lineExcerpt: { $ref: '#/components/schemas/MathText' }
        note: { $ref: '#/components/schemas/MathText', description: 以问题或提醒的口吻，不判对错 }
        createdAt: { type: string, format: date-time }
        canRedo: { type: boolean }
    Mistakes:
      type: object
      required: [groups, total]
      properties:
        groups:
          type: array
          items:
            type: object
            required: [group, title, count, items]
            properties:
              group: { type: string, enum: [definition, basis, scaling, hinted, selfcheck, other] }
              title: { type: string }
              count: { type: integer }
              items: { type: array, items: { $ref: '#/components/schemas/MistakeItem' } }
        total: { type: integer }
    Rewards:
      type: object
      description: 这一步记入的经验与徽章（add-only；没有新经验时不返回；测验作答不返回，完成时在后台一次结算）
      required: [xp, items, badges]
      properties:
        xp: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [kind, amount, label]
            properties:
              kind: { type: string, enum: [key_own, key_hinted, layer, problem, daily] }
              amount: { type: integer }
              label: { type: string }
        badges:
          type: array
          items:
            type: object
            required: [id, title, desc]
            properties: { id: { type: string }, title: { type: string }, desc: { type: string } }
        streak:
          type: object
          required: [current, extended]
          properties: { current: { type: integer }, extended: { type: boolean, description: 今天第一次有进展 } }
        goalReached: { type: boolean }
    StudentProgress:
      type: object
      required: [xpTotal, xpToday, keysToday, dailyGoal, streak, week, badges, daysLearned]
      properties:
        xpTotal: { type: integer }
        xpToday: { type: integer }
        keysToday: { type: integer, description: 今天自己写出的关键步骤数（含借助提示） }
        dailyGoal: { type: integer }
        streak:
          type: object
          required: [current, best, freezeAvailable, usedFreezeDays]
          properties:
            current: { type: integer }
            best: { type: integer }
            freezeAvailable: { type: boolean, description: 本周的请假卡还没用 }
            usedFreezeDays: { type: array, items: { type: string, format: date } }
        week:
          type: array
          description: 本周（周一到周日，Asia/Shanghai）每天的经验与关键步骤
          items:
            type: object
            required: [day, xp, keys]
            properties: { day: { type: string, format: date }, xp: { type: integer }, keys: { type: integer } }
        badges:
          type: array
          items:
            type: object
            required: [id, title, desc, earnedAt]
            properties:
              id: { type: string }
              title: { type: string }
              desc: { type: string }
              earnedAt: { type: [string, 'null'], format: date-time }
              progress:
                type: object
                required: [current, target]
                properties: { current: { type: integer }, target: { type: integer } }
        daysLearned: { type: integer }
    StudentSettings:
      type: object
      required: [nickname, dailyGoal, defaultInput, theme, sound, motion, haptics, onboarding]
      properties:
        nickname: { type: [string, 'null'] }
        dailyGoal: { type: integer, minimum: 1, maximum: 20 }
        defaultInput: { type: string, enum: [hand, keyboard, photo] }
        theme: { type: string, enum: [system, light, dark] }
        sound: { type: boolean }
        motion: { type: boolean }
        haptics: { type: boolean }
        onboarding: { type: object, additionalProperties: true }
    StudentSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        nickname: { type: string, minLength: 1, maxLength: 40 }
        dailyGoal: { type: integer, minimum: 1, maximum: 20 }
        defaultInput: { type: string, enum: [hand, keyboard, photo] }
        theme: { type: string, enum: [system, light, dark] }
        sound: { type: boolean }
        motion: { type: boolean }
        haptics: { type: boolean }
        onboarding: { type: object, additionalProperties: true }
    StudentFeedback:
      type: object
      additionalProperties: false
      required: [kind, body]
      properties:
        kind: { type: string, enum: [bug, idea, content, other] }
        body: { type: string, minLength: 1, maxLength: 2000 }
        page: { type: string, maxLength: 200 }
    PublishedReview:
      type: object
      required: [proofs]
      properties:
        proofs: { type: array, items: { $ref: '#/components/schemas/MathText' } }
        note: { $ref: '#/components/schemas/MathText' }
