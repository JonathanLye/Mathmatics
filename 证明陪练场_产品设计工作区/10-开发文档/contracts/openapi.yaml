openapi: 3.1.0
info:
  title: 证明陪练场 API
  version: 1.0.0-p0
  description: |
    三端共用的接口契约（学生端 H5/小程序、教师端、服务端）。说明见 06-接口契约.md。

    约定：
    - 基础路径 `/api/v1`；JSON UTF-8；时间 ISO 8601（UTC）。
    - 鉴权：两端各一个 HttpOnly + Secure + SameSite=Lax 的会话 Cookie，同一浏览器可同时登录两端、互不覆盖：学生 `pg_sid_s`（30 天）、教师 `pg_sid_t`（12 小时）。`/teacher*`、`/auth/teacher*` 读教师 Cookie，其余读学生 Cookie；只有 `/me`、`/auth/logout`、`/events/batch` 由请求头 `X-Pg-App: student|teacher` 指明（缺省学生）。登录只下发本端 Cookie、不吊销另一端；退出只作废并清除 `X-Pg-App` 指明的那一端。浏览器里只有另一端的会话时，守卫返回 403 `FORBIDDEN` 且 `detail.reason = "wrong_app"`（没有任何会话才是 401），两端客户端遇到 401 或 `wrong_app` 一律回登录页。旧版共用的 `pg_sid` 只读兼容：新 Cookie 不在时才读，且会话主人的角色必须与请求的那一端相符，`GET /me` 时换成对应端的新 Cookie 并清掉 `pg_sid`。教师端镜像 iframe 用短期 `mirrorToken`（查询参数），不依赖 Cookie。
    - 所有改变状态的请求（POST/PUT/PATCH/DELETE）必须带 `X-Requested-With: proof-gym` 头（CSRF 防护，见 05 §7）；缺失或不符返回 403 `FORBIDDEN`。`sendBeacon` 无法加自定义头，只能用于可靠补发的事件上报（事件 id 幂等）。
    - 写操作带 `Idempotency-Key` 头（uuid）。同一个键 24 小时内重放返回同一结果。
    - 学生作答相关的写接口一律返回 `{ state: AttemptState, ... }`。前端只渲染 `state`，不自己推算层、预算、门槛。
    - 写接口可带 `If-Match: <stateVersion>`；版本落后返回 409 `STATE_STALE` 和最新 `state`。
    - 错误统一为 `{ error: { code, message, detail? } }`，`message` 可直接给用户看。
    - **DTO 白名单**：任何学生可调用的接口都不得返回题目包 secret 部分的任何字段（关键步骤、leak、pattern、提示原文库、要点卡、参考证明）。契约测试会扫描响应体。
  contact:
    name: 证明陪练场项目组
  license:
    name: 内部使用（未开源）
    identifier: LicenseRef-Internal
servers:
  - url: /api/v1
tags:
  - name: auth
    description: 登录、会话、知情同意
  - name: student
    description: 学生首页、证明本
  - name: attempt
    description: 六层作答（服务端状态机）
  - name: input
    description: 手写/拍照识别与确认
  - name: help
    description: 求助：提示阶梯、概念解释、行检查
  - name: events
    description: 前端事件上报
  - name: teacher
    description: 班级、看板、干预、布置、导出
  - name: content
    description: 题库、审核、导入、Lean 核验
  - name: ops
    description: 健康检查

security:
  - studentCookieAuth: []

paths:
  # ------------------------------------------------------------------ auth
  /auth/student/login:
    post:
      tags: [auth]
      summary: 学生登录（学号 + 密码；首次/重置后用邀请码 + 学号激活）
      description: |
        三种用法，统一用学号 `studentNo` 标识账号：
        1. **已设密码**：必须带 `password`；任何失败（学号不存在、密码错）都返回同一条 401 `INVALID_CREDENTIALS`（学号或密码不对）。
           同时带有效的 `inviteCode` 则顺带加入该班（第二个班的入班路径；名单规则不变）。
        2. **未设密码或学号尚无账号**：必须带 `inviteCode`，按名单认领；登录成功但 `Me.needsPassword=true`，
           前端先去设密码（`POST /auth/student/password`）。名单里没有该学号返回 403 `NOT_IN_ROSTER`。
        3. **已设密码却只带邀请码**：401 `PASSWORD_REQUIRED_LOGIN`（这个学号已设置密码，请用密码登录）。堵住同学冒登。
        连续失败按 (IP, 学号) 锁定，返回 429 `RATE_LIMITED`（detail.retryAfterSec）。
      operationId: studentLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentNo, deviceId]
              properties:
                inviteCode: { type: string, minLength: 6, maxLength: 6 }
                studentNo: { type: string, minLength: 4, maxLength: 20 }
                password: { type: string, format: password, maxLength: 200 }
                deviceId: { type: string, format: uuid }
      responses:
        '200':
          description: 登录成功，已设置 Cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/student/password:
    post:
      tags: [auth]
      summary: 学生设置 / 修改密码
      description: |
        首次设置（`Me.needsPassword=true`）不需要 `currentPassword`；已有密码时必须带正确的 `currentPassword`，
        否则 403 `INVALID_CREDENTIALS`（刻意不用 401，避免客户端把它当成会话失效而跳回登录页）；连续输错同样被锁定（429）。
        新密码规则：8–64 个字符、不限字符类型，不能与学号相同，也不能是常见弱密码（422 `VALIDATION_FAILED`，message 可直接展示）。
        成功后作废该学生**其他**所有会话（当前会话保留）。服务端开启 `STUDENT_PASSWORD_ENFORCE` 时，
        未设密码的学生调用除 `/me`、`/auth/logout`、本接口之外的学生接口一律 403 `PASSWORD_SETUP_REQUIRED`。
        支持 `Idempotency-Key`。
      operationId: setStudentPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [newPassword]
              properties:
                currentPassword: { type: string, format: password, maxLength: 200 }
                newPassword: { type: string, format: password, maxLength: 200 }
      responses:
        '200':
          description: 已设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResult' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/student/age-band:
    post:
      tags: [auth]
      summary: 学生自选年龄段（13 §4；未分档的学生在开始练习前必须选择）
      description: |
        ≥18 / 14–17 / <14 三档，记录到 `app.student_profiles.age_band`。**只能设置一次**：
        已记录时返回 409 `AGE_BAND_LOCKED`，防止 <14 学生通过重新提交自我解锁（13 §4 的"不开通"是硬约束）；
        需要修改请联系教师（教师端改档为后续工作）。
        `<14` 记录后仍返回 200 + Me（ageBand=lt14），但学生写接口（作答/求助等）返回 403 `AGE_RESTRICTED`，
        `POST /consents` 与 `POST /events/batch` 同样拒绝。
        14–17 的 `GET /consents` 会附加「建议告知监护人」段（key=guardianNotice，非必选、不签署）。
        名单导入暂不支持年龄段（后续补）；未带时由本接口让学生自选。
      operationId: setStudentAgeBand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ageBand]
              properties:
                ageBand: { type: string, enum: [lt14, '14to17', ge18] }
      responses:
        '200':
          description: 已记录，返回最新 Me
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /auth/teacher/login:
    post:
      tags: [auth]
      summary: 教师登录（用户名 + 密码 + 可选 TOTP）
      operationId: teacherLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                totp: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/teacher/password:
    post:
      tags: [auth]
      summary: 教师修改密码（需当前密码；作废其他会话）
      description: 新密码至少 8 个字符。当前密码不对返回 403 `INVALID_CREDENTIALS`（不用 401，原因同学生端）；连续输错被锁定（429）。支持 `Idempotency-Key`。
      operationId: changeTeacherPassword
      security: [{ teacherCookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password, maxLength: 200 }
                newPassword: { type: string, format: password, maxLength: 200 }
      responses:
        '200':
          description: 已修改
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResult' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/logout-all:
    post:
      tags: [auth]
      summary: 退出所有设备（作废该用户全部会话并清 Cookie）
      operationId: logoutAll
      security: [{ studentCookieAuth: [] }, { teacherCookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/pgApp' }]
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '204': { description: 已退出所有设备 }
  /auth/logout:
    post:
      tags: [auth]
      summary: 退出登录
      operationId: logout
      security: [{ studentCookieAuth: [] }, { teacherCookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/pgApp' }]
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '204': { description: 已退出 }
  /me:
    get:
      tags: [auth]
      summary: 当前用户
      operationId: getMe
      security: [{ studentCookieAuth: [] }, { teacherCookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/pgApp' }]
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
  /consents:
    get:
      tags: [auth]
      summary: 当前同意书文本与本人签署状态
      operationId: getConsent
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 同意书
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentDoc' }
    post:
      tags: [auth]
      summary: 签署知情同意（service、crossBorderHosting、monitoring 为必选；crossBorderModel、research 可选）
      operationId: submitConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, items]
              properties:
                version: { type: string }
                items: { $ref: '#/components/schemas/ConsentItems' }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 已记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }

  # ------------------------------------------------------------------ student
  /student/home:
    get:
      tags: [student]
      summary: 学生首页：进行中、待完成、已完成、证明本摘要
      operationId: studentHome
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 首页数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentHome' }
  /student/assignments/{assignmentId}:
    get:
      tags: [student]
      summary: 布置详情（题面与公开配置）
      operationId: getAssignment
      parameters: [{ $ref: '#/components/parameters/assignmentId' }]
      responses:
        '200':
          description: 布置详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentCard' }
        '404': { $ref: '#/components/responses/Error' }
  /student/assignments/{assignmentId}/attempt:
    post:
      tags: [attempt]
      summary: 开始或恢复本题作答（幂等：已有作答则返回它）
      operationId: startAttempt
      parameters: [{ $ref: '#/components/parameters/assignmentId' }, { $ref: '#/components/parameters/idempotencyKey' }]
      responses:
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/StateReplay' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /student/notebook:
    get:
      tags: [student]
      summary: 我的证明本：自己写完的证明、总结、薄弱点、待重做
      operationId: getNotebook
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 证明本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notebook' }

  /student/mistakes:
    get:
      tags: [student]
      summary: 我的错题本：按卡点分组（定义没写全 / 依据缺失 / 放缩卡住 / 靠提示写出的步骤 / 自检没通过 / 其他卡点），每项可直接重做
      operationId: getMistakes
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 错题本（空分组不返回；测验布置结束前不出现）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mistakes' }
  /student/attempts/{attemptId}/redo:
    post:
      tags: [attempt]
      summary: 重做：在本人已完成的作答上新建重做作答（kind=redo，强制练习模式；已有未结束的重做则返回它）
      description: 重做不计经验（来源键与首次相同）、不进指标与导出；第 5 层（迁移题）自动跳过；布置关闭后仍可重做。测验布置开放或未开始期间返回 403 TEST_MODE_RESTRICTED；作答未完成返回 409；他人的作答返回 403。
      operationId: startRedo
      parameters: [{ $ref: '#/components/parameters/attemptId' }, { $ref: '#/components/parameters/idempotencyKey' }]
      responses:
        '200': { $ref: '#/components/responses/StateReplay' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /student/path:
    get:
      tags: [student]
      summary: 学习路径（首页）：只返回当前单元的题目详情，其余单元只有摘要
      operationId: getStudentPath
      parameters:
        - { name: unit, in: query, required: false, description: 单元 ID；缺省 = 第一个没做完的单元, schema: { type: string, format: uuid } }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '200':
          description: 路径
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentPath' }
  /student/path/items/{problemId}/start:
    post:
      tags: [attempt]
      summary: 从路径节点开始或继续一道题（懒创建本班的自学布置；已做完则返回只读回看）
      operationId: startPathItem
      description: 班里这道题有没结束的测验 → 409 TEST_IN_PROGRESS；班里有开放的教师练习布置 → 直接复用。
      parameters: [{ $ref: '#/components/parameters/problemId' }, { $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                classId: { type: string, format: uuid, description: 缺省 = 最近加入的班级 }
      responses:
        '200': { $ref: '#/components/responses/StateReplay' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /student/progress:
    get:
      tags: [student]
      summary: 学习进度：经验、连胜、本周每日、徽章
      description: 连胜按 Asia/Shanghai 自然日算，当天有经验入账才算一天；每周（周一到周日）自动有一张请假卡。徽章目录在服务端代码里。
      operationId: getProgress
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '200':
          description: 进度
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProgress' }
  /student/settings:
    get:
      tags: [student]
      summary: 我的设置（昵称、每日目标、默认输入、外观、音效/动效/震动、引导进度）
      description: 要求已签同意书（与作答接口同一守卫）。
      operationId: getSettings
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '200':
          description: 设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentSettings' }
    patch:
      tags: [student]
      summary: 修改设置（只传要改的字段）；nickname 写入 users.display_name，trim 后 1–16 个字
      operationId: patchSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentSettingsPatch' }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '200':
          description: 修改后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentSettings' }
  /student/feedback:
    post:
      tags: [student]
      summary: 问题反馈
      operationId: submitFeedback
      parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentFeedback' }
      responses:
        '204': { description: 已收到 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /student/practice:
    get:
      tags: [student]
      summary: 练习区：在全部已发布题里按章节与难度挑题（分页，章 → 难度 → ID 顺序稳定）
      operationId: listPractice
      parameters:
        - { name: chapter, in: query, schema: { type: string } }
        - { name: difficulty, in: query, schema: { $ref: '#/components/schemas/DifficultyBand' } }
        - { name: status, in: query, schema: { type: string, enum: [todo, active, done] } }
        - { name: q, in: query, description: 题目、章节、题面、标签里的关键词, schema: { type: string, maxLength: 60 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '200':
          description: 一页题目 + 分面
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeList' }
  /student/practice/random:
    post:
      tags: [student]
      summary: 随机挑一道还没做完的题（范围内都做完了返回 404）
      operationId: randomPractice
      parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                chapter: { type: string }
                difficulty: { $ref: '#/components/schemas/DifficultyBand' }
      responses:
        '200':
          description: 一道题（客户端随后调用 start）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeItem' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /student/practice/{problemId}/start:
    post:
      tags: [attempt]
      summary: 从练习区开始一道题（同 /student/path/items/{problemId}/start，同样的测验撞车拒绝）
      operationId: startPractice
      parameters: [{ $ref: '#/components/parameters/problemId' }, { $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                classId: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/StateReplay' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /student/practice/{problemId}/solution:
    get:
      tags: [student]
      summary: 解题思路与参考证明：只返回这位学生已经可以看的那一级
      operationId: getPracticeSolution
      parameters: [{ $ref: '#/components/parameters/problemId' }]
      responses:
        '200':
          description: 当前可见级别与内容
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeSolution' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /student/practice/{problemId}/solution/reveal:
    post:
      tags: [student]
      summary: 主动查看思路（approach）或完整解答（full）；只限自己的练习模式自学作答
      operationId: revealPracticeSolution
      description: 老师布置的作答、测验模式、班里有没结束的测验时 403；还没开始做这道题 409。记 `solution.revealed` 事件，之后写出的关键步骤按有提示计。
      parameters: [{ $ref: '#/components/parameters/problemId' }, { $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level: { type: string, enum: [approach, full] }
      responses:
        '200':
          description: 查看后的内容
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeSolution' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ attempt
  /attempts/{attemptId}:
    get:
      tags: [attempt]
      summary: 读取作答状态（断线重连、切回前台时调用）
      operationId: getAttempt
      parameters: [{ $ref: '#/components/parameters/attemptId' }]
      responses:
        '200': { $ref: '#/components/responses/State' }
        '404': { $ref: '#/components/responses/Error' }
  /attempts/{attemptId}/layers/{layer}/enter:
    post:
      tags: [attempt]
      summary: 切换到某层（只能去已解锁的层）
      operationId: enterLayer
      parameters: [{ $ref: '#/components/parameters/attemptId' }, { $ref: '#/components/parameters/layer' }]
      responses:
        '200': { $ref: '#/components/responses/State' }
        '409': { $ref: '#/components/responses/Error' }
  /attempts/{attemptId}/layers/{layer}/skip:
    post:
      tags: [attempt]
      summary: 跳过某层（受跳过规则约束）
      operationId: skipLayer
      parameters: [{ $ref: '#/components/parameters/attemptId' }, { $ref: '#/components/parameters/layer' }, { $ref: '#/components/parameters/idempotencyKey' }]
      responses:
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/StateReplay' }
        '409': { $ref: '#/components/responses/Error' }
  /attempts/{attemptId}/definition:
    post:
      tags: [attempt]
      summary: 第 1 层：提交定义（自然语言或符号）
      operationId: submitDefinition
      parameters: [{ $ref: '#/components/parameters/attemptId' }, { $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TextSubmission' }
      responses:
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/StateReplay' }
        '409': { $ref: '#/components/responses/Error' }
  /attempts/{attemptId}/lesson/{conceptId}:
    get:
      tags: [attempt]
      summary: 第 1–2 层：取微课（直观卡 + 分步讲解 + 图解）
      description: 文本已按当前作答过闸门（被拦的字符串换成回退文案）；小核验题只下发 q/options，答案由 `/check` 判定；按学生原话生成的补充讲解放在 `generated` 里（P0 恒为 null）。
      operationId: getLesson
      parameters: [{ $ref: '#/components/parameters/attemptId' }, { $ref: '#/components/parameters/conceptId' }]
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' } # 作答不属于本人，或概念没有已发布的微课
        '200':
          description: 微课
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonView' }
  /attempts/{attemptId}/lesson/{conceptId}/check:
    post:
      tags: [attempt]
      summary: 微课某一步的小核验
      operationId: lessonCheck
      parameters: [{ $ref: '#/components/parameters/attemptId' }, { $ref: '#/components/parameters/conceptId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stepId, choice]
              properties:
                stepId: { type: string }
                choice: { type: integer, minimum: 0 }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' } # 该步没有小核验 / 选项越界 / 步骤不存在
        '200':
          description: 判定与反馈
          content:
            application/json:
              schema:
                type: object
                required: [correct, feedback, state]
                properties:
                  correct: { type: boolean }
                  feedback: { $ref: '#/components/schemas/MathText' }
                  nextStepId: { type: [string, 'null'] }
                  state: { $ref: '#/components/schemas/AttemptState' }
  /attempts/{attemptId}/framework:
    post:
      tags: [attempt]
      summary: 第 2 层：提交证明骨架
      operationId: submitFramework
      parameters: [{ $ref: '#/components/parameters/attemptId' }, { $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TextSubmission' }
      responses:
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/StateReplay' }
  /attempts/{attemptId}/framework/template:
    post:
      tags: [attempt]
      summary: 第 2 层：查看通用骨架模板（形式部分，不计透露量）
      operationId: viewFrameTemplate
      parameters: [{ $ref: '#/components/parameters/attemptId' }, { $ref: '#/components/parameters/idempotencyKey' }]
      responses:
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/StateReplay' }
  /attempts/{attemptId}/lines:
    post:
      tags: [attempt]
      summary: 第 3 层（含迁移题）：加入一行证明
      description: 服务端归类（规则为主，Jev 影子），在 `state.notes` 里追加锚定本行的批注。手写/拍照来源必须带已确认的 `recogId`。
      operationId: addLine
      parameters: [{ $ref: '#/components/parameters/attemptId' }, { $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LineSubmission' }
      responses:
        '429': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/StateReplay' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /attempts/{attemptId}/lines/{lineId}:
    patch:
      tags: [attempt]
      summary: 修改一行（重新归类；原文保留在事件里）
      operationId: editLine
      parameters: [{ $ref: '#/components/parameters/attemptId' }, { $ref: '#/components/parameters/lineId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LineSubmission' }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/State' }
    delete:
      tags: [attempt]
      summary: 删除一行（软删除）
      operationId: deleteLine
      parameters: [{ $ref: '#/components/parameters/attemptId' }, { $ref: '#/components/parameters/lineId' }]
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/State' }
  /attempts/{attemptId}/finish:
    post:
      tags: [attempt]
      summary: 第 3 层：点"写完了"
      operationId: finishProof
      parameters: [{ $ref: '#/components/parameters/attemptId' }, { $ref: '#/components/parameters/idempotencyKey' }]
      responses:
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/StateReplay' }
  /attempts/{attemptId}/selfcheck/{itemId}:
    post:
      tags: [attempt]
      summary: 第 4 层：回答一道自检题
      operationId: answerSelfcheck
      parameters: [{ $ref: '#/components/parameters/attemptId' }, { name: itemId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TextSubmission' }
      responses:
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/StateReplay' }
  /attempts/{attemptId}/transfer:
    post:
      tags: [attempt]
      summary: 第 5 层：开始迁移题（创建子作答，返回子作答的 state）
      operationId: startTransfer
      parameters: [{ $ref: '#/components/parameters/attemptId' }, { $ref: '#/components/parameters/idempotencyKey' }]
      responses:
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/StateReplay' }
        '409': { $ref: '#/components/responses/Error' }
  /attempts/{attemptId}/summary:
    post:
      tags: [attempt]
      summary: 第 6 层：提交五问总结
      operationId: submitSummary
      parameters: [{ $ref: '#/components/parameters/attemptId' }, { $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers, input]
              properties:
                answers:
                  type: array
                  minItems: 5
                  maxItems: 5
                  items: { $ref: '#/components/schemas/MathText' }
                input: { $ref: '#/components/schemas/InputMeta' }
      responses:
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/StateReplay' }
  /attempts/{attemptId}/park:
    post:
      tags: [attempt]
      summary: 先搁置本题
      operationId: parkAttempt
      parameters: [{ $ref: '#/components/parameters/attemptId' }, { $ref: '#/components/parameters/idempotencyKey' }]
      responses:
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/StateReplay' }
  /attempts/{attemptId}/draft:
    put:
      tags: [attempt]
      summary: 草稿备份（前端以 IndexedDB 为主，这里每 15 秒或切后台时备份一次）
      operationId: putDraft
      parameters: [{ $ref: '#/components/parameters/attemptId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, content]
              properties:
                target: { type: string }
                content: { type: object }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '204': { description: 已保存 }
  /attempts/{attemptId}/review:
    get:
      tags: [attempt]
      summary: 查看参考证明与讲评：教师布置要教师已发布，且本人写完或布置结束；自学作答本人写完后即可看；班里该题有没结束的测验时 403（读参考证明记审计）
      operationId: getPublishedReview
      parameters: [{ $ref: '#/components/parameters/attemptId' }]
      responses:
        '200':
          description: 参考证明与讲评
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishedReview' }
        '404': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ input / recognition
  /recognitions/ink:
    post:
      tags: [input]
      summary: 识别一行手写（写完这一行时调用，不做实时识别）
      description: 上传 ink-v1 笔迹（gzip 后 base64）。服务端保存原始笔迹，主识别 + 交叉比对，返回 MathText 供学生确认/修改。
      operationId: recognizeInk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attemptId, draftId, target, ink]
              properties:
                attemptId: { type: string, format: uuid }
                draftId: { type: string, format: uuid }
                target: { $ref: '#/components/schemas/InputTarget' }
                ink: { type: string, contentEncoding: base64, description: 'gzip(JSON ink-v1)，≤ 256KB' }
      responses:
        '200':
          description: 识别结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recognition' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /recognitions/photo:
    post:
      tags: [input]
      summary: 拍照识别（整页 → 切行）
      operationId: recognizePhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [attemptId, draftId, target, image]
              properties:
                attemptId: { type: string, format: uuid }
                draftId: { type: string, format: uuid }
                target: { $ref: '#/components/schemas/InputTarget' }
                source: { type: string, enum: [camera, album] }
                image: { type: string, format: binary, description: 'JPEG/PNG，前端压到长边 ≤ 2000px、≤ 2MB，去 EXIF' }
      responses:
        '200':
          description: 切行后的识别结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recognition' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /recognitions/{recogId}/confirm:
    post:
      tags: [input]
      summary: 学生确认（可改过）识别结果；之后才能用它提交
      description: |
        手写：以最后一次确认为准。拍照：一张照片的 recogId 会被逐批确认（每批 `lines`），已确认的行累加（只增不减）。
        提交（`/lines` 等）时服务端核对：recogId 属于本人本次作答、已确认、来源类型一致、提交文字与确认文字 canon 后一致，否则 409 `RECOG_NOT_CONFIRMED`。
        没有结果的识别（status=empty）不能确认（422）。
      operationId: confirmRecognition
      parameters: [{ name: recogId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { $ref: '#/components/schemas/MathText' }
                lines: { type: array, items: { $ref: '#/components/schemas/MathText' }, description: '拍照：确认后的各行' }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '200':
          description: 已确认
          content:
            application/json:
              schema:
                type: object
                required: [recogId, edited]
                properties:
                  recogId: { type: string, format: uuid }
                  edited: { type: boolean }
                  rendered: { type: boolean, description: KaTeX 是否能渲染 }

  # ------------------------------------------------------------------ help
  /attempts/{attemptId}/help:
    post:
      tags: [help]
      summary: 求助（一个入口，三种意图 + 自由提问）
      description: |
        - `stuck`：返回下一条提示的**预览**（级别、将计入的透露量、能否领取）。H0/H1 直接下发；H2 起要再调 `/hints/claim` 才下发。
        - `concept`：概念解释（词条/微课入口），不计透露量。
        - `check_line`：对指定行（缺省最新一行）给批注。
        - `free`：自由提问，服务端判意图后按上面三类处理；索要答案/施压一句拒绝 + H0。
        - 开了 `help.llm` 时，`concept` / `free` / `check_line` 的回答由模型生成（已过三重闸门），`note.aiGenerated = true`，响应头 `X-AIGC: 1`；闸门拦下或模型不可用时回退模板回答（`aiGenerated` 缺省）。
      operationId: requestHelp
      parameters: [{ $ref: '#/components/parameters/attemptId' }, { $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intent]
              properties:
                intent: { type: string, enum: [stuck, concept, check_line, free] }
                text: { type: string, maxLength: 300 }
                lineId: { type: string, format: uuid }
      responses:
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 求助结果
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpResult' }
  /attempts/{attemptId}/hints/claim:
    post:
      tags: [help]
      summary: 确认领取一条计透露量的提示（H2–H4）
      description: 必须带 `/help` 返回的 `previewToken`（60 秒有效）。服务端重新检查门槛（再写一行、停留 20 秒、连点锁、额度），不读学生文本。
      operationId: claimHint
      parameters: [{ $ref: '#/components/parameters/attemptId' }, { $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [previewToken]
              properties:
                previewToken: { type: string }
      responses:
        '422': { $ref: '#/components/responses/Error' }
        '200':
          description: 提示已下发
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpResult' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /attempts/{attemptId}/flag-teacher:
    post:
      tags: [help]
      summary: 标记求助老师（额度用完，或卡住满 stuckMs 后）
      description: 写入 `app.help_flags`，教师看板显示求助；重复调用返回当前状态（幂等）。测验模式 403。
      operationId: flagTeacher
      parameters: [{ $ref: '#/components/parameters/attemptId' }, { $ref: '#/components/parameters/idempotencyKey' }]
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '200': { $ref: '#/components/responses/StateReplay' }

  /student/notes/{noteId}/feedback:
    post:
      tags: [help]
      summary: 对一条 AI 回答点“有用 / 没用”（13 §5）
      description: 只能点自己作答里的批注（`Note.noteId`）；可以改主意，以最后一次为准。
      operationId: noteFeedback
      parameters:
        - { name: noteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/idempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [useful]
              additionalProperties: false
              properties:
                useful: { type: boolean }
      responses:
        '204': { description: 已记录 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ events
  /events/batch:
    post:
      tags: [events]
      summary: 批量上报前端事件（幂等）
      description: 每批 ≤ 100 条、≤ 256KB。按事件 `id` 去重。只接受 events.schema.json 中 $defs/ClientEvent 允许的类型；服务端类型一律拒收。
      operationId: ingestEvents
      security: [{ studentCookieAuth: [] }, { teacherCookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/pgApp' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  maxItems: 100
                  items: { $ref: './events.schema.json#/$defs/ClientEvent' }
      responses:
        '429': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 入库结果
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicates, rejected]
                properties:
                  accepted: { type: integer }
                  duplicates: { type: integer }
                  rejected:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        reason: { type: string }
                  integrity: { $ref: '#/components/schemas/IntegrityView' }

  # ------------------------------------------------------------------ teacher
  /teacher/classes:
    get:
      tags: [teacher]
      summary: 我的班级
      operationId: listClasses
      security: [{ teacherCookieAuth: [] }]
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 班级列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClassSummary' }
    post:
      tags: [teacher]
      summary: 建班（生成邀请码）
      operationId: createClass
      security: [{ teacherCookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, term]
              properties:
                name: { type: string }
                term: { type: string }
                settings: { $ref: '#/components/schemas/ClassSettings' }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '201':
          description: 已建班
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassSummary' }
  /teacher/classes/{classId}/settings:
    patch:
      tags: [teacher]
      summary: 更新班级默认设置（拍照/微课生成/默认预算/诚信/测验切出）
      operationId: updateClassSettings
      security: [{ teacherCookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/classId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassSettings' }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassSummary' }
  /teacher/classes/{classId}/roster:
    get:
      tags: [teacher]
      summary: 名单列表（认领状态；学号只存哈希不返回）
      operationId: listRoster
      security: [{ teacherCookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/classId' }]
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '200':
          description: 名单
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RosterEntry' }
    post:
      tags: [teacher]
      summary: 导入名单（CSV：学号,姓名；姓名可空）
      operationId: importRoster
      security: [{ teacherCookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/classId' }]
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 导入结果
          content:
            application/json:
              schema:
                type: object
                required: [added, duplicates, invalid]
                properties:
                  added: { type: integer }
                  duplicates: { type: integer }
                  invalid: { type: array, items: { type: object, properties: { row: { type: integer }, reason: { type: string } } } }
  /teacher/classes/{classId}/roster/{rosterId}:
    delete:
      tags: [teacher]
      summary: 解除认领（学生换设备/异常时；写 audit_log）
      operationId: unclaimRoster
      security: [{ teacherCookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/classId' }
        - { name: rosterId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '204': { description: 已解除 }
  /teacher/classes/{classId}/roster/{rosterId}/reset-password:
    post:
      tags: [teacher]
      summary: 重置学生密码（清哈希、作废该生全部会话；写 audit_log）
      description: 名单行必须已被认领、且班级归当前教师；学生之后用邀请码 + 学号重新激活并设置新密码。重置是账号级的（该生在其他班也要重新设密码）。
      operationId: resetStudentPassword
      security: [{ teacherCookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/classId' }
        - { name: rosterId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '204': { description: 已重置 }
  /teacher/classes/{classId}/invite-code:
    post:
      tags: [teacher]
      summary: 重置邀请码
      operationId: rotateInvite
      security: [{ teacherCookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/classId' }]
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 新邀请码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassSummary' }
  /teacher/classes/{classId}/live:
    get:
      tags: [teacher]
      summary: 实时看板快照（P0 每 5 秒轮询；P1 改用 /stream）
      operationId: getLive
      security: [{ teacherCookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/classId' }, { name: assignmentId, in: query, schema: { type: string, format: uuid } }]
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 看板快照
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSnapshot' }
  /teacher/classes/{classId}/stream:
    get:
      tags: [teacher]
      summary: 实时看板推送（SSE）
      description: '事件名：`row`（某学生行变化，data=LiveRow）、`flag`（新诚信/求助标记）、`ping`（每 20 秒）。断线重连后重推当前快照；前端另有 5s 轮询兜底。'
      operationId: streamLive
      security: [{ teacherCookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/classId' }
        - { name: assignmentId, in: query, schema: { type: string, format: uuid }, description: 缺省为最近开放的布置 }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
  /teacher/classes/{classId}/metrics:
    get:
      tags: [teacher]
      summary: 班级指标（口径见 08-事件与数据字典.md §4）
      operationId: getMetrics
      security: [{ teacherCookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/classId' }, { name: assignmentId, in: query, schema: { type: string, format: uuid } }]
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 指标
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsView' }
  /teacher/classes/{classId}/self-study:
    get:
      tags: [teacher]
      summary: 自学进度：本班学生在学习路径各单元的完成情况（不进看板、指标与导出）
      operationId: getSelfStudy
      parameters: [{ $ref: '#/components/parameters/classId' }]
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '200':
          description: 自学进度
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelfStudyView' }
  /teacher/attempts/{attemptId}:
    get:
      tags: [teacher]
      summary: 学生作答详情（全部行、批注、提示、识别、诚信信号、时间线）
      operationId: getAttemptDetail
      security: [{ teacherCookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/attemptId' }]
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptDetail' }
  /teacher/attempts/{attemptId}/events:
    get:
      tags: [teacher]
      summary: 作答事件流（回放用；按 seq 分页）
      operationId: getAttemptEvents
      security: [{ teacherCookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/attemptId' }
        - { name: afterSeq, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 事件
          content:
            application/json:
              schema:
                type: object
                required: [events, nextSeq]
                properties:
                  events: { type: array, items: { $ref: './events.schema.json' } }
                  nextSeq: { type: [integer, 'null'] }
  /teacher/attempts/{attemptId}/lines/{lineId}/reclassify:
    post:
      tags: [teacher]
      summary: 教师改判一行归类（写 audit_log；不改学生已看到的注解/事件，04 §4）
      operationId: reclassifyLine
      security: [{ teacherCookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/attemptId' }
        - { name: lineId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cls]
              properties:
                cls: { type: string, enum: [match, error, unknown, lowconf, demo_needs_reason, pass, fail] }
                keys: { type: array, maxItems: 50, items: { type: string }, description: 必须是本题题目包里的关键步骤 ID；match 时必须非空 }
                errorId: { type: [string, 'null'], description: 必须是本题题目包里的错误 ID；仅 cls=error 时可传且必传 }
                note: { type: string, maxLength: 200 }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '200':
          description: 改判结果
          content:
            application/json:
              schema:
                type: object
                required: [lineId, cls, keys, errorId, classifierPath]
                properties:
                  lineId: { type: string, format: uuid }
                  cls: { type: string }
                  keys: { type: array, items: { type: string } }
                  errorId: { type: [string, 'null'] }
                  classifierPath: { type: string }
  /teacher/attempts/{attemptId}/stream:
    get:
      tags: [teacher]
      summary: 镜像预览推送（SSE，P1）：该作答每次 state_version 变化推送学生视图
      description: '事件名：`state`（data=AttemptState，与学生端看到的完全一致）、`ping`（每 20 秒）。可用教师 Cookie 或 mirrorToken 鉴权。'
      operationId: streamAttempt
      security: [{ teacherCookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/attemptId' }
        - { name: token, in: query, schema: { type: string }, description: mirror-token 返回的只读令牌（iframe 内使用） }
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /teacher/attempts/{attemptId}/mirror-token:
    post:
      tags: [teacher]
      summary: 取镜像预览令牌（P1）：教师端 iframe 用它以只读模式打开学生页面
      operationId: getMirrorToken
      security: [{ teacherCookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/attemptId' }]
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 5 分钟有效的只读令牌
          content:
            application/json:
              schema:
                type: object
                required: [token, url, expiresAt]
                properties:
                  token: { type: string }
                  url: { type: string, description: '/s/mirror?attempt=…&token=…' }
                  expiresAt: { type: string, format: date-time }
  /teacher/attempts/{attemptId}/unlock:
    post:
      tags: [teacher]
      summary: 解锁作答（测验模式切出过多被锁等）；可同时补发一条 H4（额度耗尽出口）
      operationId: unlockAttempt
      security: [{ teacherCookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/attemptId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                grantH4: { type: string, description: '解锁时补发 H4 的关键步骤 ID（可选；空串=下一个未完成的步骤）。只在学生额度耗尽后可用（否则 409），一个步骤只能补发一次（422）；补发会记 teacherOverride（hint.deliver.override=true，不增加 reveal），且该步需学生补依据≥6字才计入 matched；本题完成时 attempt.complete.teacherOverrides 记录，独立度按补发计入。补发的 H4 以批注形式出现在学生的 AttemptState.notes 里。' }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '200':
          description: 已解锁
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptDetail' }
  /teacher/attempts/{attemptId}/nudge:
    post:
      tags: [teacher]
      summary: 给学生发一句话（同样过闸门；被改写会告知教师）
      operationId: nudgeStudent
      security: [{ teacherCookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/attemptId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 200 }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 已发送
          content:
            application/json:
              schema:
                type: object
                required: [shown, gated]
                properties:
                  shown: { $ref: '#/components/schemas/MathText' }
                  gated: { type: boolean }
  /teacher/flags/{flagId}/resolve:
    post:
      tags: [teacher]
      summary: 处理求助标记或诚信信号
      operationId: resolveFlag
      security: [{ teacherCookieAuth: [] }]
      parameters: [{ name: flagId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                disposition: { type: string, enum: [dismissed, noted, talked] }
                note: { type: string }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '204': { description: 已处理 }
  /teacher/assignments:
    get:
      tags: [teacher]
      summary: 班级布置列表（按开放时间倒序；状态按数据库时钟推导）
      operationId: listAssignments
      security: [{ teacherCookieAuth: [] }]
      parameters:
        - { name: classId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '200':
          description: 布置
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssignmentCard' }
    post:
      tags: [teacher]
      summary: 布置练习或测验
      operationId: createAssignment
      security: [{ teacherCookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentCreate' }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '201':
          description: 已布置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentCard' }
  /teacher/assignments/{assignmentId}:
    patch:
      tags: [teacher]
      summary: 修改布置（时间、开关；已开始的作答不受题目版本变化影响）
      operationId: updateAssignment
      security: [{ teacherCookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/assignmentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentCreate' }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 已修改
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentCard' }
  /teacher/assignments/{assignmentId}/publish-review:
    post:
      tags: [teacher]
      summary: 题目关闭后发布参考证明与讲评（A/B 两组同时发布）
      operationId: publishReview
      security: [{ teacherCookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/assignmentId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                proofIds: { type: array, items: { type: string } }
                note: { $ref: '#/components/schemas/MathText' }
      responses:
        '200':
          description: 已发布
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentCard' }
        '409': { $ref: '#/components/responses/Error' }
  /teacher/exports:
    post:
      tags: [teacher]
      summary: 导出（默认匿名；实名需管理员审批）
      operationId: createExport
      security: [{ teacherCookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classId, format, tables]
              properties:
                classId: { type: string, format: uuid }
                assignmentIds: { type: array, items: { type: string, format: uuid } }
                format: { type: string, enum: [csv, xlsx, jsonl] }
                tables: { type: array, items: { type: string, enum: [attempts, lines, hints, help, recognitions, integrity, events] } }
                anonymized: { type: boolean, default: true }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '202':
          description: 已排队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJob' }
  /teacher/exports/{exportId}:
    get:
      tags: [teacher]
      summary: 导出任务状态与下载链接
      operationId: getExport
      security: [{ teacherCookieAuth: [] }]
      parameters: [{ name: exportId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJob' }

  /teacher/exports/{exportId}/download:
    get:
      tags: [teacher]
      summary: 下载导出文件（同源教师 Cookie；仅创建者或管理员）
      operationId: downloadExport
      security: [{ teacherCookieAuth: [] }]
      parameters: [{ name: exportId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '200':
          description: 文件流（csv/jsonl 为 zip；xlsx 为 Excel）
          content:
            application/zip:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  # ------------------------------------------------------------------ content
  /teacher/problems:
    get:
      tags: [content]
      summary: 题库列表（含审核状态）
      operationId: listProblems
      security: [{ teacherCookieAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, pending, returned, published, retired] } }
        - { name: chapter, in: query, schema: { type: string } }
        - { name: q, in: query, description: 标题、章节或题号关键词, schema: { type: string, maxLength: 60 } }
        - { name: reviewSource, in: query, description: 老师审核 = teacher；AI 整理（批量导入）= auto, schema: { type: string, enum: [teacher, auto] } }
        - { name: kind, in: query, description: 主题 = main；迁移题 = transfer, schema: { type: string, enum: [main, transfer] } }
        - { name: limit, in: query, description: 给了才分页（1–100）；不给 = 返回全部，兼容旧调用, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, description: 上一页响应头 X-Next-Cursor, schema: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '200':
          description: 题目（分页时下一页游标在响应头 X-Next-Cursor，没有下一页则不返回该头）
          headers:
            X-Next-Cursor: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProblemListItem' }
  /teacher/problems/{problemId}/visibility:
    patch:
      tags: [content]
      summary: 下架 / 恢复上架一道题（设置或清除 hidden_at）
      description: 下架后这道题不再出现在学生的学习路径与练习区；已有作答和老师已布置的题不受影响。写一条审计记录。
      operationId: setProblemVisibility
      security: [{ teacherCookieAuth: [] }]
      parameters:
        - { name: problemId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hidden]
              properties:
                hidden: { type: boolean }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '200':
          description: 当前状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemVisibility' }
  /teacher/problems/{problemId}/versions/{version}:
    get:
      tags: [content]
      summary: 完整题目包（含 secret；仅教师/审核角色；读参考证明记审计）
      operationId: getProblemVersion
      security: [{ teacherCookieAuth: [] }]
      parameters:
        - { name: problemId, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '200':
          description: 题目包（不含 referenceProofs：参考证明单独存放在 vault.reference_proofs，pg_app 不可读）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemPackageView' }
  /teacher/problems/{problemId}/versions/{version}/review:
    post:
      tags: [content]
      summary: 审核结论（通过 / 退回 / 直接修改后通过）
      operationId: reviewProblem
      security: [{ teacherCookieAuth: [] }]
      parameters:
        - { name: problemId, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, return, edit] }
                comments: { type: string }
                edited: { $ref: './problem-package.schema.json' }
                minutes: { type: integer, minimum: 0 }
      responses:
        '200':
          description: 已记录（approve 且自动校验全过时发布为新版本）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemListItem' }
        '422': { $ref: '#/components/responses/Error' }
  /teacher/imports:
    post:
      tags: [content]
      summary: 发起题库导入任务（PDF 页码范围 → 题目包草稿）
      operationId: createImport
      security: [{ teacherCookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceId]
              properties:
                sourceId: { type: string, format: uuid }
                pages: { type: array, items: { type: integer }, description: 页码范围，缺省为整本 }
                chapters: { type: array, items: { type: integer } }
                itemTypes: { type: array, items: { type: string, enum: [example, exam, exercise] } }
                proofOnly: { type: boolean, default: true }
                maxDrafts: { type: integer, default: 10 }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '202':
          description: 已排队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
  /teacher/imports/{jobId}:
    get:
      tags: [content]
      summary: 导入任务进度与草稿列表
      operationId: getImport
      security: [{ teacherCookieAuth: [] }]
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 进度
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
  /teacher/lean/check:
    post:
      tags: [content]
      summary: 用 Lean 4 + mathlib 编译题目包登记的参考证明（沿用 08 server.mjs，转为 worker 任务）
      operationId: leanCheck
      security: [{ teacherCookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [problemId, version]
              properties:
                problemId: { type: string }
                version: { type: integer }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 编译结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  sorry: { type: boolean }
                  ms: { type: integer }
                  toolchain: { type: string }
                  output: { type: string }

  # ------------------------------------------------------------------ ops
  /health:
    get:
      tags: [ops]
      summary: 健康检查（公开，只回答服务是否在运行；不含依赖与开关明细）
      operationId: health
      security: []
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: 状态
          content:
            application/json:
              schema:
                type: object
                required: [ok, status, service]
                properties:
                  ok: { type: boolean }
                  status: { type: string, enum: [ok] }
                  service: { type: string }
  /health/details:
    get:
      tags: [ops]
      summary: 健康明细（各外部依赖可用性与降级开关状态；需 x-health-token，值守/监控用）
      description: 请求头 x-health-token 必须等于服务端环境变量 HEALTH_TOKEN；未配置 HEALTH_TOKEN 或令牌不符都返回 404（不暴露该路径存在）。反代只放行 /health，不要把 /health/details 暴露到公网。
      operationId: healthDetails
      security: []
      parameters:
        - { name: x-health-token, in: header, required: true, schema: { type: string } }
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '200':
          description: 状态明细
          content:
            application/json:
              schema:
                type: object
                required: [ok, status, service, env, uptimeSec, deps, flags]
                properties:
                  ok: { type: boolean }
                  status: { type: string, enum: [ok] }
                  service: { type: string }
                  env: { type: string }
                  uptimeSec: { type: integer }
                  deps: { type: object, additionalProperties: { type: string, enum: [ok, degraded, down, disabled] } }
                  flags: { type: object, additionalProperties: { type: boolean } }

components:
  securitySchemes:
    studentCookieAuth:
      type: apiKey
      in: cookie
      name: pg_sid_s
      description: 学生端会话，30 天。除 `/teacher*`、`/auth/teacher*` 外的接口读这个 Cookie。
    teacherCookieAuth:
      type: apiKey
      in: cookie
      name: pg_sid_t
      description: 教师端会话，12 小时。`/teacher*`、`/auth/teacher*` 读这个 Cookie。
  parameters:
    pgApp:
      name: X-Pg-App
      in: header
      required: false
      description: '两端共用接口（`/me`、`/auth/logout`、`/events/batch`）读哪一端的 Cookie：student 读 `pg_sid_s`，teacher 读 `pg_sid_t`；缺省按 student。其余接口按路径决定，忽略此头。'
      schema: { type: string, enum: [student, teacher], default: student }
    attemptId: { name: attemptId, in: path, required: true, schema: { type: string, format: uuid } }
    assignmentId: { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
    classId: { name: classId, in: path, required: true, schema: { type: string, format: uuid } }
    lineId: { name: lineId, in: path, required: true, schema: { type: string, format: uuid } }
    problemId: { name: problemId, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' } }
    conceptId: { name: conceptId, in: path, required: true, schema: { type: string } }
    layer: { name: layer, in: path, required: true, schema: { $ref: '#/components/schemas/LayerId' } }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: '写接口幂等键（UUID）。24 小时内同键重放返回首次响应（带 Idempotent-Replayed: true）；同键不同请求 422；上一次仍在处理 429。'
      schema: { type: string, format: uuid }
  headers:
    IdempotentReplayed:
      description: 仅当本次请求是同一 Idempotency-Key 的重放时返回 "true"；首次响应不返回该头。
      schema: { type: string, enum: ['true'] }
  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    State:
      description: 最新作答状态
      content:
        application/json:
          schema:
            type: object
            required: [state]
            properties:
              state: { $ref: '#/components/schemas/AttemptState' }
    StateReplay:
      description: 最新作答状态（写接口；重放时带 Idempotent-Replayed 响应头）
      headers:
        Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
      content:
        application/json:
          schema:
            type: object
            required: [state]
            properties:
              state: { $ref: '#/components/schemas/AttemptState' }
              rewards: { $ref: '#/components/schemas/Rewards' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, NOT_IN_ROSTER, INVALID_INVITE, CONSENT_REQUIRED, AGE_BAND_REQUIRED, AGE_RESTRICTED, AGE_BAND_LOCKED, INVALID_CREDENTIALS, PASSWORD_REQUIRED_LOGIN, PASSWORD_SETUP_REQUIRED, WRONG_LAYER, LAYER_LOCKED, STATE_STALE, ATTEMPT_LOCKED, ASSIGNMENT_CLOSED, RECOG_NOT_CONFIRMED, HINT_NOT_READY, HINT_PREVIEW_EXPIRED, BUDGET_EXHAUSTED, RATE_LIMITED, PAYLOAD_TOO_LARGE, PHOTO_DISABLED, TEST_MODE_RESTRICTED, UPSTREAM_UNAVAILABLE, VALIDATION_FAILED, INTERNAL, TEST_IN_PROGRESS]
            message: { type: string, description: 可直接展示给用户的中文 }
            detail: { type: object, description: '如 { waitSec, softLanding: [...], state }' }
    OkResult:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: { type: boolean }
    MathText:
      type: string
      maxLength: 4000
      description: 中文 + $…$ 行内 LaTeX；字面 $ 写作 \$
    LayerId:
      type: string
      enum: [L1, L2, L3, L4, L5, L6]
    InputTarget:
      type: string
      enum: [def, frame, line_statement, line_justification, selfcheck, summary, help_text]
    Me:
      type: object
      additionalProperties: false
      required: [userId, role, anonCode, consentRequired]
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, enum: [student, teacher, admin] }
        anonCode: { type: string }
        displayName: { type: [string, 'null'] }
        classes: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string } } } }
        consentRequired: { type: boolean }
        ageBand: { type: [string, 'null'], enum: [lt14, '14to17', ge18, null], description: '年龄分档（13 §4）；学生必返。null=尚未选择，需先调 POST /auth/student/age-band；lt14 不开通（写接口 403 AGE_RESTRICTED）' }
        needsPassword: { type: boolean, description: '仅学生返回：true=账号还没设密码，前端先去 POST /auth/student/password（密码设好前，开启强制时其余学生接口 403 PASSWORD_SETUP_REQUIRED）' }
        features: { type: object, additionalProperties: { type: boolean }, description: '功能开关：photo, lessonGenerated, mirror, testMode …' }
    ConsentItems:
      type: object
      required: [service, crossBorderHosting, crossBorderModel, monitoring, research]
      properties:
        service: { type: boolean, description: 服务所需处理（必选） }
        crossBorderHosting: { type: boolean, description: 数据存储于中国香港服务器（P0 必选） }
        crossBorderModel: { type: boolean, description: 去标识化后的作答文本发送给境外决策模型 Jev（可选；不同意则网关对该生跳过 Jev） }
        monitoring: { type: boolean, description: 作答过程监测（必选） }
        research: { type: boolean, description: 匿名数据用于教研（可选） }
    ConsentDoc:
      type: object
      additionalProperties: false
      required: [version, sections, signed]
      properties:
        version: { type: string }
        sections:
          type: array
          items:
            type: object
            required: [key, title, body, required]
            properties:
              key: { type: string, enum: [service, crossBorderHosting, crossBorderModel, monitoring, research, guardianNotice] }
              title: { type: string }
              body: { type: string }
              required: { type: boolean }
        signed: { type: [object, 'null'] }
    StudentHome:
      type: object
      required: [inProgress, todo, done]
      properties:
        inProgress: { type: array, items: { $ref: '#/components/schemas/AssignmentCard' } }
        todo: { type: array, items: { $ref: '#/components/schemas/AssignmentCard' } }
        done: { type: array, items: { $ref: '#/components/schemas/AssignmentCard' } }
        week: { type: object, properties: { keysOwn: { type: integer }, keysTotal: { type: integer }, problemsDone: { type: integer } }, description: '本周"自己写出的关键步骤"' }
        notebook: { type: object, properties: { cards: { type: integer }, toRedo: { type: integer } } }
    AssignmentCard:
      type: object
      required: [assignmentId, title, mode, status]
      properties:
        assignmentId: { type: string, format: uuid }
        title: { type: string }
        chapter: { type: string }
        stem: { $ref: '#/components/schemas/MathText', description: 仅在布置详情里返回；首页卡片不再带整段题面 }
        mode: { type: string, enum: [practice, test] }
        status: { type: string, enum: [scheduled, open, closed, cancelled] }
        openAt: { type: string, format: date-time }
        closeAt: { type: [string, 'null'], format: date-time }
        attemptId: { type: [string, 'null'], format: uuid }
        attemptStatus: { type: [string, 'null'], enum: [active, parked, locked, completed, abandoned, null] }
        currentLayer: { oneOf: [{ $ref: '#/components/schemas/LayerId' }, { type: 'null' }] }
        problemId: { type: string }
        version: { type: integer }
        settings: { type: object, additionalProperties: true }
        reviewPublished: { type: boolean }
    PublicProblemView:
      type: object
      additionalProperties: false
      required: [problemId, version, title, stem, chapter, keyCount]
      properties:
        problemId: { type: string }
        version: { type: integer }
        title: { type: string }
        stem: { $ref: '#/components/schemas/MathText' }
        chapter: { type: string }
        source: { type: string, description: '显示用来源，如 华东师大版同步辅导 · 第二章 · 例 4' }
        keyCount: { type: integer }
        askChips: { type: array, items: { type: string } }
    LayerStatus:
      type: object
      required: [layer, title, status, enabled, skippable]
      properties:
        layer: { $ref: '#/components/schemas/LayerId' }
        title: { type: string }
        status: { type: string, enum: [locked, active, done, skipped, disabled] }
        enabled: { type: boolean }
        skippable: { type: boolean }
    ProofLine:
      type: object
      additionalProperties: false
      required: [lineId, n, statement, provenance, flagged]
      properties:
        lineId: { type: string, format: uuid }
        n: { type: integer, minimum: 1 }
        statement: { $ref: '#/components/schemas/MathText' }
        justification: { $ref: '#/components/schemas/MathText' }
        provenance: { type: string, enum: [ink, keyboard, photo, mixed, paste] }
        flagged: { type: boolean, description: 有一个待回应的批注（不代表"错"） }
        createdAt: { type: string, format: date-time }
    Note:
      type: object
      description: 右栏/行内的一条批注或回复。text 已过闸门。
      additionalProperties: false
      required: [noteId, kind, who, text, at]
      properties:
        noteId: { type: string, format: uuid }
        kind: { type: string, enum: [annotation, hint, concept, system, refusal, lesson, nudge, student] }
        who: { type: string, description: '显示的署名：批注 / H2 · 透露 0.5 / 助教 / 老师 / 你' }
        text: { $ref: '#/components/schemas/MathText' }
        lineId: { type: [string, 'null'], format: uuid, description: 锚定的行（行内显示） }
        level: { type: [string, 'null'], enum: [H0, H1, H2, H3, H4, null] }
        cost: { type: [number, 'null'] }
        lessonConceptId: { type: [string, 'null'], description: 有值时显示"看分步讲解"入口 }
        aiGenerated: { type: boolean, description: '模型生成的回答（界面显示“AI 生成 · 仅作学习提示”，响应头 X-AIGC: 1；13 §5）' }
        at: { type: string, format: date-time }
    BudgetView:
      type: object
      required: [revealUsed, revealMax, keysOwn, keysTotal]
      properties:
        revealUsed: { type: number }
        revealMax: { type: number }
        keysOwn: { type: integer, description: 自己写出的关键步骤数（H4 示范后写出依据才算） }
        keysTotal: { type: integer }
    HelpState:
      type: object
      additionalProperties: false
      required: [hintAvailable, exhausted, flagged]
      properties:
        hintAvailable: { type: boolean, description: 当前层是否提供提示阶梯 }
        nextLevel: { type: [string, 'null'], enum: [H0, H1, H2, H3, H4, null] }
        nextCost: { type: [number, 'null'], description: '领取下一条将增加的透露量（花之前显示）' }
        waitSec: { type: [integer, 'null'], description: 停留门槛剩余秒数 }
        needAttempt: { type: boolean, description: 需要先再写一行 }
        rapidLockUntil: { type: [string, 'null'], format: date-time }
        exhausted: { type: boolean }
        flagged: { type: boolean }
        stuckOffer: { type: boolean, description: 连续卡住，界面可温和询问是否需要提示 }
        canFlag: { type: boolean, description: '现在可以“找老师”（额度用完，或卡住满 stuckMs），且还没找过' }
    IntegrityView:
      type: object
      required: [mode, locked]
      properties:
        mode: { type: string, enum: [practice, test] }
        locked: { type: boolean }
        warnings: { type: integer }
        maxWarnings: { type: [integer, 'null'] }
        notice: { type: [string, 'null'], description: 需要展示的一次性提醒文案 }
        watermark: { type: [string, 'null'], description: '测验模式水印文字（匿名码 + 时间）' }
    DefView:
      type: object
      properties:
        task: { $ref: '#/components/schemas/MathText' }
        conceptId: { type: string }
        submissions: { type: integer }
        last: { $ref: '#/components/schemas/MathText' }
        feedback: { $ref: '#/components/schemas/MathText', description: 最近一次核对没通过时缺的那一个成分（或顺序追问），一次只说一件事；通过或离开本层后不再下发 }
        lessonSuggested: { type: boolean, description: 两次未过时为 true，界面主动展开"分步讲解" }
        lessonAvailable: { type: boolean, description: 概念缺失或没有微课步骤时为 false，界面隐藏微课入口（GET lesson 对缺失概念是 404） }
    FrameView:
      type: object
      properties:
        task: { $ref: '#/components/schemas/MathText' }
        lessonId: { type: string }
        last: { $ref: '#/components/schemas/MathText' }
        feedback: { $ref: '#/components/schemas/MathText', description: 最近一次核对没通过时缺的那一部分骨架；通过或离开本层后不再下发 }
        templateShown: { type: boolean }
        template: { oneOf: [{ $ref: '#/components/schemas/MathText' }, { type: 'null' }] }
    StepsView:
      type: object
      additionalProperties: false
      properties:
        lines: { type: array, items: { $ref: '#/components/schemas/ProofLine' } }
        canFinish: { type: boolean }
    SelfcheckView:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            required: [itemId, question, status]
            properties:
              itemId: { type: string }
              question: { $ref: '#/components/schemas/MathText' }
              answer: { $ref: '#/components/schemas/MathText' }
              status: { type: string, enum: [open, accepted, followup] }
    SummaryView:
      type: object
      properties:
        questions: { type: array, items: { type: string }, minItems: 5, maxItems: 5 }
        answers: { type: array, items: { $ref: '#/components/schemas/MathText' } }
        followup: { oneOf: [{ $ref: '#/components/schemas/MathText' }, { type: 'null' }] }
    TransferView:
      type: object
      properties:
        childAttemptId: { type: [string, 'null'], format: uuid }
        stem: { $ref: '#/components/schemas/MathText' }
        status: { type: string, enum: [not_started, active, completed, skipped] }
    AttemptState:
      type: object
      description: 学生端唯一的状态来源（DTO 白名单：只含这里列出的字段）
      additionalProperties: false
      required: [attemptId, stateVersion, kind, status, mode, problem, currentLayer, layers, budget, notes, help, integrity, serverTime]
      properties:
        attemptId: { type: string, format: uuid }
        parentAttemptId: { type: [string, 'null'], format: uuid }
        stateVersion: { type: integer }
        kind: { type: string, enum: [main, transfer, redo] }
        status: { type: string, enum: [active, parked, locked, completed, abandoned] }
        mode: { type: string, enum: [practice, test] }
        problem: { $ref: '#/components/schemas/PublicProblemView' }
        currentLayer: { $ref: '#/components/schemas/LayerId' }
        layers: { type: array, items: { $ref: '#/components/schemas/LayerStatus' } }
        budget: { $ref: '#/components/schemas/BudgetView' }
        def: { $ref: '#/components/schemas/DefView' }
        frame: { $ref: '#/components/schemas/FrameView' }
        steps: { $ref: '#/components/schemas/StepsView' }
        selfcheck: { $ref: '#/components/schemas/SelfcheckView' }
        transfer: { $ref: '#/components/schemas/TransferView' }
        summary: { $ref: '#/components/schemas/SummaryView' }
        notes: { type: array, items: { $ref: '#/components/schemas/Note' }, description: 最近 50 条，按时间正序 }
        help: { $ref: '#/components/schemas/HelpState' }
        integrity: { $ref: '#/components/schemas/IntegrityView' }
        completion:
          type: object
          properties:
            done: { type: boolean }
            independence: { type: [number, 'null'] }
            reviewAvailable: { type: boolean }
            leanCard: { type: [object, 'null'], description: '完成后展示的 mathlib4 对照（只含定理名，不含学生没写过的步骤）' }
        serverTime: { type: string, format: date-time }
    InputMeta:
