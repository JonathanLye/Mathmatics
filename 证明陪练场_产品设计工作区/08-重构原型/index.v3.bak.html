<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>证明陪练场 v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 布局：左侧六层目录 · 中间学生的证明稿 · 右侧页边批注（像助教的红笔），手机上依次堆叠 */
:root{
  --paper:#f7f8fa; --sheet:#ffffff; --ink:#1d2430; --muted:#5d6878; --rule:#dfe3ea;
  --accent:#2b4fa3; --accent-soft:#e8eefb; --margin:#9a3b4f; --margin-soft:#f7ecef;
  --ok:#2f7a54; --warn:#9a6b12;
  --f-display:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12161d; --sheet:#1a1f28; --ink:#e4e8ef; --muted:#9aa5b5; --rule:#2c3442;
  --accent:#8fb0ff; --accent-soft:#1f2b45; --margin:#e58aa0; --margin-soft:#33202a;
  --ok:#6fcf9b; --warn:#e3b65a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161d; --sheet:#1a1f28; --ink:#e4e8ef; --muted:#9aa5b5; --rule:#2c3442;
  --accent:#8fb0ff; --accent-soft:#1f2b45; --margin:#e58aa0; --margin-soft:#33202a;
  --ok:#6fcf9b; --warn:#e3b65a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.65 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:baseline;gap:20px;flex-wrap:wrap;padding-block:18px 14px;border-bottom:1px solid var(--rule);max-width:1280px;margin:0 auto}
header h1{font:700 19px/1.2 var(--f-display);margin:0;letter-spacing:.02em}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs button{background:none;border:0;padding:6px 10px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
main{max-width:1280px;margin:0 auto}
.grid{display:grid;grid-template-columns:210px minmax(0,1fr) 300px;gap:28px;padding-top:22px}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
/* 目录 */
.outline{display:flex;flex-direction:column;gap:18px;min-width:0}
.probsel{display:flex;flex-direction:column;gap:6px}
.probsel label{font-size:12px;color:var(--muted);letter-spacing:.06em}
select{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:6px 8px;width:100%}
ol.layers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;counter-reset:l}
ol.layers li button{all:unset;display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:baseline;width:100%;padding:6px 8px;border-radius:4px;cursor:pointer;box-sizing:border-box}
ol.layers li button:focus-visible{outline:2px solid var(--accent)}
ol.layers li button[disabled]{cursor:default;color:var(--muted);opacity:.6}
ol.layers li button.cur{background:var(--accent-soft)}
.ln{font:500 12px var(--f-mono);color:var(--muted)}
.lt{font-size:14px}
.ls{font:12px var(--f-mono);color:var(--muted)}
.ls.done{color:var(--ok)}
@media (max-width:980px){
  ol.layers{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  ol.layers li button{grid-template-columns:auto auto;white-space:nowrap}
  ol.layers .ls{display:none}
}
.budget{font:12px/1.6 var(--f-mono);color:var(--muted);border-top:1px solid var(--rule);padding-top:12px}
.budget b{color:var(--ink);font-weight:500}
/* 正文 */
.sheet{min-width:0;display:flex;flex-direction:column;gap:20px}
.stem{font:500 17px/1.8 var(--f-display);padding-bottom:14px;border-bottom:1px solid var(--rule)}
.stem .src{display:block;font:12px var(--f-body);color:var(--muted);margin-top:4px}
h2{font:700 16px/1.3 var(--f-display);margin:0;text-wrap:balance}
.task{color:var(--muted);margin:4px 0 0;max-width:62ch}
textarea{width:100%;min-height:72px;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:10px 12px;resize:vertical;line-height:1.6}
textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--accent);color:var(--sheet);border:0;border-radius:4px;padding:8px 16px;cursor:pointer;font-weight:500}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--rule)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.keys{display:flex;flex-wrap:wrap;gap:4px}
.keys button{min-width:34px;padding:4px 8px;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;cursor:pointer;font:15px var(--f-mono)}
.keys button:hover{border-color:var(--accent)}
/* 证明行 */
ol.proof{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
ol.proof li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding:10px 0;border-bottom:1px solid var(--rule)}
ol.proof .no{font:500 13px var(--f-mono);color:var(--muted);padding-top:2px}
ol.proof .st{font-family:var(--f-display);overflow-wrap:anywhere}
ol.proof .ju{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
ol.proof .ju::before{content:"依据　"}
ol.proof li.flag .no{color:var(--margin);font-weight:700}
.stepform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:560px){.stepform{grid-template-columns:minmax(0,1fr)}}
.fl{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.card{border:1px solid var(--rule);border-radius:6px;padding:14px 16px;background:var(--sheet);display:flex;flex-direction:column;gap:10px}
.card dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}
.card dt{color:var(--muted);font-size:13px}
.card dd{margin:0}
.distort{border-left:3px solid var(--warn);padding-left:10px}
.choice{display:flex;gap:16px;flex-wrap:wrap}
.qs{display:flex;flex-direction:column;gap:14px}
/* 批注 */
.marginal{min-width:0;display:flex;flex-direction:column;gap:14px}
@media (min-width:981px){.marginal{position:sticky;top:16px;align-self:start}}
.note{border-left:3px solid var(--margin);background:var(--margin-soft);padding:10px 12px;border-radius:0 4px 4px 0;display:flex;flex-direction:column;gap:4px}
.note .who{font:12px var(--f-mono);color:var(--margin)}
.note.sys{border-color:var(--accent);background:var(--accent-soft)}
.note.sys .who{color:var(--accent)}
.note.hint{border-color:var(--warn)}
.note.hint .who{color:var(--warn)}
.notes{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto}
.ask{display:flex;gap:6px}
.ask input{flex:1;min-width:0;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:7px 10px}
.small{font-size:12px;color:var(--muted)}
/* 教师 / 事件 */
.wide{padding-top:22px;display:flex;flex-direction:column;gap:16px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12px}
td.mono{font-family:var(--f-mono)}
tr.live td{background:var(--accent-soft)}
pre.log{font:12px/1.6 var(--f-mono);background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:12px;overflow:auto;max-height:60vh;margin:0}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--accent);vertical-align:middle}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>证明陪练场</h1>
  <span class="small">数学分析 · 原型 v3</span>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-s" aria-selected="true" data-view="s">练习</button>
    <button role="tab" id="tab-t" aria-selected="false" data-view="t">教师</button>
    <button role="tab" id="tab-e" aria-selected="false" data-view="e">事件</button>
  </nav>
</header>
<main>
  <section id="view-s" class="grid">
    <aside class="outline">
      <div class="probsel">
        <label for="prob">题目</label>
        <select id="prob"></select>
      </div>
      <ol class="layers" id="layers"></ol>
      <div class="budget" id="budget"></div>
    </aside>
    <article class="sheet" id="sheet"></article>
    <aside class="marginal">
      <div class="notes" id="notes" aria-live="polite"></div>
      <div class="row">
        <button class="btn ghost" id="hintBtn" type="button">要一条提示</button>
        <span class="small" id="hintState"></span>
      </div>
      <form class="ask" id="askForm">
        <input id="askInput" placeholder="问一句（关于当前这一行）" autocomplete="off">
        <button class="btn ghost" type="submit">发送</button>
      </form>
    </aside>
  </section>
  <section id="view-t" class="wide" hidden></section>
  <section id="view-e" class="wide" hidden></section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
'use strict';
/* ============ 题目包（教师审核；keys/leak/要点卡仅服务端可见，前端原型里用于闸门演示） ============ */
const PKG = {
  epsN: {
    title: '数列极限 · ε-N',
    stem: '用 $\\varepsilon$-$N$ 定义证明 $\\displaystyle\\lim_{n\\to\\infty}\\frac{3n+1}{n+2}=3$。',
    src: '数学分析 · 第二章 · 必做',
    def: {
      task: '写出"数列 $\\{a_n\\}$ 以 $A$ 为极限"的定义，用量词。',
      checks: [
        [/(∀|任意|任给|对一切).{0,3}ε/, '缺少"对任意 ε>0"'],
        [/(∃|存在).{0,4}N/, '缺少"存在 N"'],
        [/n\s*[>＞]\s*N/, '缺少"当 n>N 时"'],
        [/\|\s*a_?n\s*[-−]\s*A\s*\|\s*[<＜]\s*ε/, '缺少"|a_n − A| < ε"']
      ],
      order: [/(∀|任意|任给|对一切).{0,3}ε/, /(∃|存在).{0,4}N/],
      card: {
        plain: '不管划多窄的一条带子，数列从某一项起都待在带子里。',
        map: [['带子的半宽', 'ε'], ['从某一项起', '∃N，∀n>N'], ['待在带子里', '|a_n − A| < ε']],
        distort: '这里没有"越来越近"的意思。常数列 a_n = 3 每一项都等于 3，极限也是 3。"无限接近"的说法会让人误以为 a_n ≠ A。',
        q: '常数列 $a_n=3$ 以 $3$ 为极限吗？',
        opts: ['是', '不是'], ans: 0,
        back: '是。对任意 ε>0，取 N=1，|a_n − 3| = 0 < ε。现在回到你的定义。'
      }
    },
    frame: {
      task: '写出这个证明的骨架：开头写什么、结尾要落到什么、中间要构造的是什么。不必写出构造本身。',
      checks: [
        [/(任取|任给|设|对任意|∀).{0,6}ε/, '开头：先固定任意的 ε>0'],
        [/(取|存在|令|∃).{0,6}N/, '中间：要构造一个 N'],
        [/n\s*[>＞]\s*N/, '对 n>N 的情形'],
        [/[<＜]\s*ε/, '结尾：落到某个量 < ε']
      ],
      template: '要证 ∀ε>0 ∃N ∀n>N：P。骨架：任取 ε>0。取 N = ＿（待构造）。则当 n>N 时，… < ε。'
    },
    keys: [
      { id: 'K1', pat: [/5\s*\/\s*\(\s*n\s*[+＋]\s*2\s*\)/], leak: ['5/(n+2)'],
        H: ['你要让哪个量小于 ε？先把它写成最简的样子。',
            '回到目标：|a_n − 3| < ε。先单独处理 |a_n − 3|。',
            ['通分以后，|a_n − 3| 会变成一个只含 n 的分式。', .5],
            ['分子是 3n+1 − 3(n+2)。把它算出来，再看分母。', 1],
            ['|a_n − 3| = 5/(n+2)。下一行由你写：要让它 < ε，n 需要满足什么？', 1]] },
      { id: 'K2', pat: [/n\s*[>＞]\s*5\s*\/\s*ε/, /5\s*\/\s*n(?![+＋\d])/, /5\s*\/\s*ε\s*[-−]\s*2/], leak: ['5/n', '5/ε'],
        H: ['你现在要从 "某式 < ε" 推出关于 n 的条件。',
            '你只需要 n 的一个充分条件，不必是充要条件。',
            ['试着把上一行的分式放大成更简单、关于 n 单调的式子。', .5],
            ['5/(n+2) < 5/n。', 1],
            ['5/n < ε 当且仅当 n > 5/ε。下一行：N 取什么？你来写。', 1]] },
      { id: 'K3', pat: [/N\s*[=≥]\s*[^,，。；;]*5\s*\/\s*ε/, /N\s*[=≥]\s*[^,，。；;]*⌈/], leak: ['⌈5/ε⌉', 'N=5/ε', 'N≥5/ε'],
        H: ['N 可以依赖哪些量？',
            '定义里 N 在 n 之前取定，所以 N 只能依赖 ε。',
            ['把上一行关于 n 的条件，改写成"只要 N 取得够大"。', .5],
            ['取 N 使得 N ≥ 5/ε。', 1],
            ['N = ⌈5/ε⌉。下一行：对 n>N 写出结论。', 1]] },
      { id: 'K4', pat: [/n\s*[>＞]\s*N[\s\S]*[<＜]\s*ε/], leak: [],
        H: ['你最终要写下的那个不等式是什么？',
            '收尾：对 n>N，把前面的不等式连起来，落到 < ε。',
            ['把"化简"和"放大"两行接成一条链。', .5],
            ['当 n>N 时，|a_n − 3| = … < … < ε。省略号由你补。', 1],
            ['当 n>N 时，|a_n − 3| = 5/(n+2) < 5/n < ε。最后写一句结论。', 1]] }
    ],
    routes: [['K1', 'K2', 'K3', 'K4']],
    errs: [
      { pat: /N\s*=\s*[^,，。；;则时当]*\bn\b/, q: '你取的 N 里出现了 n。定义里 N 在 n 之前取定，N 能依赖 n 吗？' },
      { pat: /\|\s*a_?n\s*[-−]\s*3\s*\|\s*=\s*(?!5)\d+\s*\/\s*\(\s*n\s*[+＋]\s*2\s*\)/, q: '这一行的分子，请你再算一次。' },
      { pat: /[>＞]\s*ε\s*$/, q: '这一行的不等号方向，和你要证的方向一致吗？' }
    ],
    selfcheck: v => [
      `第 ${v} 行是由哪几行、用什么推出的？`,
      '你的证明里，N 起什么作用？它依赖哪些量？',
      '如果把"n>N"换成"n≥1"，你的证明哪一行会断？'
    ],
    transfer: '用 $\\varepsilon$-$\\delta$ 定义证明 $\\displaystyle\\lim_{x\\to 1}(2x+1)=3$。',
    points: [[/依赖|只与\s*ε|只能依赖/, '你的总结没有提到 N 和 ε 的依赖关系。它重要吗？'],
             [/放大|放缩|充分/, '你的总结没有提到"放大到更简单的式子"这一步。它是本题的关键选择吗？']]
  },
  series: {
    title: '交错级数 · 收敛性',
    stem: '判断 $\\displaystyle\\sum_{n=1}^{\\infty}\\frac{(-1)^{n-1}}{\\sqrt n}$ 是发散、条件收敛还是绝对收敛，并证明你的结论。',
    src: '数学分析 · 第十二章 · 必做',
    def: {
      task: '写出级数 $\\sum a_n$ "绝对收敛"和"条件收敛"的定义。',
      checks: [
        [/绝对收敛[^。；;]*(\|a_?n\||绝对值)[^。；;]*收敛/, '"绝对收敛"的定义不完整'],
        [/条件收敛[^。；;]*收敛[^。；;]*(\|a_?n\||绝对值)[^。；;]*发散/, '"条件收敛"要同时说清两件事']
      ],
      order: [],
      card: {
        plain: '条件收敛：靠正负项互相抵消才收敛；全部取绝对值后就收不住了。',
        map: [['靠抵消才收敛', '∑a_n 收敛'], ['取绝对值后收不住', '∑|a_n| 发散']],
        distort: '"抵消"不等于"正负交替"。∑(−1)^n 正负交替，却发散，因为通项不趋于 0。',
        q: '$\\sum(-1)^n$ 正负交替，它收敛吗？',
        opts: ['收敛', '发散'], ans: 1,
        back: '发散：部分和在 −1 与 0 之间来回跳。交替只是抵消的前提之一。现在回到你的定义。'
      }
    },
    frame: {
      task: '先写出你的判断，再写出要证明这个判断需要证哪几件事。不必写出怎么证。',
      checks: [
        [/(发散|条件收敛|绝对收敛)/, '先给出判断'],
        [/(两|二|2|①|\(1\)|（1）)/, '这个判断需要拆成几件事？'],
        [/(\|a_?n\||绝对值)/, '有一件事是关于 ∑|a_n| 的']
      ],
      template: '判断：＿。要证：(1) ∑a_n ＿；(2) ∑|a_n| ＿。'
    },
    keys: [
      { id: 'K1', pat: [/(递减|单调减|单调下降|u_?\{?n\s*[+＋]\s*1\}?\s*[<≤]\s*u_?n|1\s*\/\s*√\s*\(?n\s*[+＋]\s*1\)?\s*[<≤]\s*1\s*\/\s*√\s*n)/], leak: ['单调递减', '1/√(n+1)<1/√n'],
        H: ['通项的绝对值 1/√n，随 n 增大会怎样变化？你写过它的依据吗？',
            '对交错级数，先把通项写成 (−1)^{n−1}u_n，单独研究 u_n。',
            ['比较 u_{n+1} 和 u_n。', .5],
            ['n+1 > n，所以 √(n+1) > √n。取倒数后呢？', 1],
            ['1/√(n+1) < 1/√n，即 {u_n} 单调递减。下一行由你写。', 1]] },
      { id: 'K2', pat: [/(→\s*0|趋于\s*0|极限[^。；;]{0,6}0|lim[^。；;]*=\s*0)/], leak: ['1/√n→0', '极限为0'],
        H: ['u_n 的极限你写了吗？',
            '收敛性判别通常要求通项趋于 0。你的证明里有这一条吗？',
            ['1/√n 是 n 的几次幂？', .5],
            ['由 √n → +∞ 得出 u_n 的极限。', 1],
            ['lim 1/√n = 0。下一行：用前两行得出什么？', 1]] },
      { id: 'K3', pat: [/(莱布尼茨|Leibniz|狄利克雷|Dirichlet)[^。；;]*收敛/i], leak: ['莱布尼茨', '狄利克雷', 'Leibniz', 'leibniz', 'Dirichlet', 'dirichlet'],
        H: ['你已经有了关于 u_n 的两条性质。它们合起来能推出什么？',
            '回到你的骨架：第 (1) 件事还没证完。',
            ['交错级数有现成的判别法。它要求哪些条件？', .5],
            ['由莱布尼茨判别法，∑a_n 收敛。请核对它的条件你都写过了。', 1],

/* ============ 闸门：所有外发文本都要经过 ============
   规则：文本中不得出现任何关键步骤的 leak 片段，
   除非该关键步骤已出现在学生自己的文本中，或本条是已计透露量的提示（allow 里列出） */
function gate(text, allow = []) {
  const c = compact(text);
  const st = cur();
  for (const k of P().keys) {
    if (st.matched.has(k.id) || allow.includes(k.id)) continue;
    for (const f of k.leak) {
      if (c.includes(compact(f))) {
        log('gate_block', { key: k.id, frag: f });
        return '我先不说这一点。你现在写到哪一行了？这一行的依据是什么？';
      }

  }

}
function say(text, who = '批注', kind = '', allow = []) {

/* ============ 归类器（原型：规则匹配；正式版为 LLM 结构化输出 + 置信度） ============ */
function classify(text) {
  const p = P();
  for (const e of p.errs) if (e.pat.test(text)) return { type: 'err', q: e.q };
  const hits = p.keys.filter(k => k.pat.some(r => r.test(text))).map(k => k.id);
  return hits.length ? { type: 'match', keys: hits } : { type: 'unknown' };
}

  const st = cur();

function submitStep() {

    step.flag = true;
    say(`第 ${st.steps.length} 行来自示范。先用你自己的话写出它为什么成立（填在"依据"里），这一步才算你的。`);

  } else say(`第 ${st.steps.length} 行和要证的结论是什么关系？它的依据是哪条定义或定理？`);

}

  if (st.layer === 2) return say(P().frame.template, '通用骨架', 'hint');

  st.hintLv[k.id] = lv + 1; st.lastHintAt = now; st.submitsSinceHint = 0;
  log('hint', { key: k.id, level: 'H' + Math.min(lv, 4), cost });
  say(text, 'H' + Math.min(lv, 4) + (cost ? ` · 透露 ${cost}` : ''), 'hint', cost > 0 ? [k.id] : []);
  renderLayers(); renderHintState();
}
function renderHintState() {
  const st = cur(), k = nextKey();
  const lv = k ? (st.hintLv[k.id] ?? 0) : 0;
  $('#hintState').textContent = st.layer === 3 && k ? `下一条：H${Math.min(lv, 4)}` : '';
}
function renderNotes() {
  const n = cur().notes;
  $('#notes').innerHTML = n.length ? n.slice(-8).map(x => `<div class="note ${x.kind}"><span class="who">${esc(x.who)}</span><div>${esc(x.t)}</div></div>`).join('')
    : '<p class="small">批注会出现在这里。一次只问一个问题。</p>';
  $('#notes').scrollTop = 1e6;
  renderHintState();
}
$('#hintBtn').onclick = requestHint;
$('#askForm').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('#askInput').value.trim(); if (!q) return;
  $('#askInput').value = '';
  cur().notes.push({ who: '你', kind: 'sys', t: q });
  const pressure = /(答案|完整证明|直接告诉|标准解|老师说|老师允许|我已经会了|求你|拜托)/.test(q);
  log('ask', { pressure });
  if (pressure) {
    const k = nextKey();
    say('不提供完整证明或下一步，这一点不会因为任何理由改变。你可以先做这个：' + (k ? k.H[0] : '回到骨架，检查链条。'));
  } else say('我只回应和当前这一行有关的问题。你卡在哪一行？是结论不确定，还是依据不确定？');
});

/* ============ 教师 ============ */
function indep(st) { return Math.max(0, 1 - st.reveal / P().keys.length); }
const DEMO_ROWS = [
  ['S-0412', .92, '6:40', '41 s', 0, '—'], ['S-0417', .75, '3:05', '28 s', 0, 'K2 放大'], ['S-0420', .50, '1:12', '9 s', 2, 'K3 N 的选取'],
  ['S-0431', 1.0, '—', '—', 0, '—'], ['S-0436', .62, '2:30', '33 s', 0, 'K1 化简'], ['S-0444', .58, '0:48', '6 s', 3, 'K3 N 的选取']
];
function renderTeacher() {
  const st = cur();
  const fh = st.firstHelpAt ? Math.round((st.firstHelpAt - st.start) / 1000) : null;
  const live = ['本会话', indep(st), fh == null ? '—' : `${Math.floor(fh / 60)}:${String(fh % 60).padStart(2, '0')}`, '—', S.events.filter(e => e.type === 'rapid_hint').length,
    nextKey() ? nextKey().id : '—'];
  const rows = [live, ...DEMO_ROWS];
  $('#view-t').innerHTML = `<div><h2>${esc(P().title)} · 过程数据</h2>
    <p class="task">独立度 = 1 − 透露量 / 关键步骤数。第一行是你刚才的会话，其余为示例数据。</p></div>
    <div class="tablewrap"><table><thead><tr><th>匿名 ID</th><th>独立度</th><th></th><th>首次求助前</th><th>提示后停留（中位）</th><th>连点次数</th><th>当前卡点</th></tr></thead>
    <tbody>${rows.map((r, i) => `<tr class="${i === 0 ? 'live' : ''}"><td class="mono">${r[0]}</td><td class="mono">${r[1].toFixed(2)}</td>
      <td><span class="bar" style="width:${Math.round(r[1] * 80)}px"></span></td><td class="mono">${r[2]}</td><td class="mono">${r[3]}</td><td class="mono">${r[4]}</td><td>${esc(r[5])}</td></tr>`).join('')}</tbody></table></div>
    <p class="small">关键步骤文本只在教师端和题目包中出现，学生端任何接口都不返回。</p>`;
}
function renderEvents() {
  $('#view-e').innerHTML = `<div class="row"><h2>事件流</h2><span class="small">只追加 · ${S.events.length} 条</span>
    <button class="btn ghost" type="button" id="copyCsv">复制为 CSV</button></div>
    <pre class="log" id="evlog">${esc(S.events.slice(-200).map(e => JSON.stringify(e)).join('\n') || '还没有事件。去"练习"页操作一下。')}</pre>`;
  $('#copyCsv').onclick = () => {
    const cols = ['ts', 'pid', 'type'];
    const csv = [cols.concat('data').join(',')].concat(S.events.map(e => { const { ts, pid, type, ...d } = e; return [ts, pid, type, JSON.stringify(d).replace(/,/g, ';')].join(','); })).join('\n');
    const done = () => { $('#copyCsv').textContent = '已复制'; };
    try { navigator.clipboard.writeText(csv).then(done, () => { $('#evlog').textContent = csv; }); } catch (e) { $('#evlog').textContent = csv; }
  };
}

/* ============ 总渲染 ============ */
function renderAll() { renderLayers(); renderSheet(); renderNotes(); }
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => {
  S.view = b.dataset.view;
  document.querySelectorAll('nav.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  ['s', 't', 'e'].forEach(v => $('#view-' + v).hidden = v !== S.view);
  if (S.view === 't') renderTeacher();
  if (S.view === 'e') renderEvents();
});
$('#prob').innerHTML = Object.entries(PKG).map(([k, v]) => `<option value="${k}">${esc(v.title)}</option>`).join('');
$('#prob').onchange = e => { S.pid = e.target.value; log('open_problem', {}); renderAll(); };
window.__proto = { S, PKG, gate, classify, cur, nextKey, requestHint, submitStep };
log('open_problem', {});
renderAll();
window.addEventListener('load', () => math(document.body));
</script>
