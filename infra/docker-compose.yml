# 证明陪练场 P0 部署（05 §8）
# 用法：cp infra/.env.example infra/.env && 填写，然后 docker compose -f infra/docker-compose.yml up -d

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: proof_gym
      POSTGRES_USER: proof_gym
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proof_gym -d proof_gym"]
      interval: 10s
      timeout: 3s
      retries: 10

  # 一次性迁移：server 启动前执行 pnpm db:migrate 的等价命令（幂等，见 apps/server/migrations/README.md）。
  # 种子题目不在这里导入：首次部署后手动 `docker compose run --rm migrate node apps/server/src/db/cli.ts seed`。
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["node", "apps/server/src/db/cli.ts", "migrate"]
    restart: "no"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://proof_gym:${POSTGRES_PASSWORD:?}@postgres:5432/proof_gym
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # 容器内必须监听所有网卡，Caddy 才连得上 server:3000；端口只 expose 不 publish，外网到不了。
      HOST: 0.0.0.0
      DATABASE_URL: postgres://proof_gym:${POSTGRES_PASSWORD:?}@postgres:5432/proof_gym
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["node", "apps/worker/src/main.ts"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://proof_gym:${POSTGRES_PASSWORD:?}@postgres:5432/proof_gym
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
