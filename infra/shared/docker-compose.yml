# 共用主机部署（与已有站点同机、完全隔离）。默认的 infra/docker-compose.yml 面向“独占服务器”，不要在共用主机上用它。
# 用法见 infra/shared/README.md。镜像在本机构建后 docker load 到服务器，服务器上不构建、不访问 Docker Hub。
#
# 隔离原则：
#   - 独立 Compose 项目名 proofgym → 容器/网络/卷全部带 proofgym 前缀，docker ps 一眼分得清。
#   - 独立 bridge 网络 br-proofgym（固定网段，避开 eth0 的 172.20.80.0/20 与 docker0 的 172.17.0.0/16）。
#   - 只发布两个回环端口（127.0.0.1），公网到不了；由主机 nginx 新增的子域名 server 块反代进来。
#   - 每个服务有内存/CPU/进程数上限；内存紧张时内核先杀我们（oom_score_adj），cpu_shares 低于主站进程。
#   - 不用 host 网络、不挂载宿主机目录、不改 Docker 守护进程配置（live-restore 关着，重启 dockerd 会停掉主站的容器）。
name: proofgym

x-common: &common
  restart: unless-stopped
  networks: [proofgym]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  oom_score_adj: 500
  cpu_shares: 128
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *common
    image: postgres:16
    # 小内存调优：max_connections 40 ≥ server 池 10 + worker 池 10 + 迁移/运维余量。
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
      - -c
      - wal_compression=on
    # 官方镜像入口用 gosu 降权并 chown 数据目录，需要这几个 capability。
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: proof_gym
      POSTGRES_USER: proof_gym
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proof_gym -d proof_gym"]
      interval: 10s
      timeout: 3s
      retries: 10

  # 一次性迁移（幂等）。种子题目不在这里导入，见 README。
  migrate:
    <<: *common
    image: proofgym-server:${TAG:?TAG 必须设置}
    command: ["node", "apps/server/src/db/cli.ts", "migrate"]
    restart: "no"
    env_file: [.env]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://proof_gym:${POSTGRES_PASSWORD:?}@postgres:5432/proof_gym
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 100
    depends_on:
      postgres:
        condition: service_healthy

  server:
    <<: *common
    image: proofgym-server:${TAG:?}
    env_file: [.env]
    environment:
      NODE_ENV: production
      # 容器内监听所有网卡；对宿主机只发布到 127.0.0.1（见 ports），公网到不了。
      HOST: 0.0.0.0
      DATABASE_URL: postgres://proof_gym:${POSTGRES_PASSWORD:?}@postgres:5432/proof_gym
      # 老生代堆上限低于容器上限，让 GC 先于 OOM 起作用。
      NODE_OPTIONS: --max-old-space-size=230
    # 主机 nginx 直连 server（不经过 Caddy）：服务端只信任最近一跳代理（trustNearestProxy），
    # nginx→server 单跳时 request.ip 才是真实学生 IP；多一跳 Caddy 会让全班共用一个登录限流额度。
    ports:
      - "127.0.0.1:${GYM_SERVER_PORT:-18081}:3000"
    mem_limit: 320m
    memswap_limit: 320m
    cpus: 0.5
    pids_limit: 150
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  worker:
    <<: *common
    image: proofgym-server:${TAG:?}
    command: ["node", "apps/worker/src/main.ts"]
    env_file: [.env]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://proof_gym:${POSTGRES_PASSWORD:?}@postgres:5432/proof_gym
      NODE_OPTIONS: --max-old-space-size=140
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.25
    pids_limit: 100
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # 只托管静态文件（学生端 /、教师端 /t/）。/api 与 /health 由主机 nginx 直接反代到 server。
  web:
    <<: *common
    image: proofgym-web:${TAG:?}
    ports:
      - "127.0.0.1:${GYM_WEB_PORT:-18080}:8080"
    mem_limit: 48m
    memswap_limit: 48m
    cpus: 0.25
    pids_limit: 50

networks:
  proofgym:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-proofgym
    ipam:
      config:
        - subnet: 10.88.77.0/24

volumes:
  postgres_data:
